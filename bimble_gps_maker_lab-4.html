<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bimble GPS Maker Lab</title>
<style>
:root{--bg:#10140f;--card:#18211a;--line:#2a3a26;--ink:#e8f0de;--mut:#93a889;--acc:#ffd23a;--red:#d42020;--grn:#3fae6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 ui-monospace,Menlo,Consolas,monospace}
#top{position:sticky;top:0;z-index:5;background:#05070a;border-bottom:2px solid var(--line)}
#stage{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:repeating-conic-gradient(#222 0 25%,#1a1a1a 0 50%) 0 0/18px 18px}
#gad{transform-origin:top center;flex:none}
#gad canvas{display:block;image-rendering:pixelated}
#hud{padding:3px 8px;color:var(--acc);font-size:12px;min-height:22px;background:#0a0f0c}
#quick{display:flex;flex-wrap:wrap;gap:4px;padding:4px 6px;background:#0a0f0c}
#quick button{min-height:34px;padding:4px 8px;font-size:12px;border-radius:8px}
#sb{position:fixed;left:0;width:20px;bottom:0;background:#12201a;border-right:2px solid #1d3326;touch-action:none;user-select:none;-webkit-user-select:none;z-index:6}
#sbt{position:absolute;left:2px;right:2px;top:0;height:60px;background:#3fae6a;border-radius:8px;touch-action:none}
#pg{padding:8px 8px 120px 28px;max-width:560px;margin:0 auto}
h3{margin:14px 0 6px;font-size:12px;color:var(--acc);letter-spacing:.08em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
button,.bt{background:#1f2c20;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
button:active{background:#2c3f2e}
button.on{background:var(--grn);color:#06140b}
button.pri{background:var(--red);border-color:#8f1212;color:#fff}
button.sq{min-width:44px;padding:0 6px;font-size:20px}
.grow{flex:1}
.sl{margin:6px 0}
.sl .nm{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.sl .nm b{color:var(--ink)}
.sl .rw{display:flex;gap:6px;align-items:center}
input[type=range]{flex:1;height:34px;accent-color:var(--grn);min-width:0}
input[type=text],input[type=number]{flex:1;background:#0c120d;color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:8px;font:inherit;min-width:0}
input[type=color]{width:56px;height:44px;border:2px solid var(--line);border-radius:8px;background:none;padding:2px}
textarea{width:100%;background:#0c120d;color:var(--ink);border:2px solid var(--line);border-radius:8px;font:11px ui-monospace,monospace;padding:6px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.small{color:var(--mut);font-size:11.5px}
.sub{margin:8px 0 2px;color:var(--acc);font-size:11.5px;letter-spacing:.06em}
</style></head><body>
<div id="top">
  <div id="stage"><div id="gad"><canvas id="cv"></canvas></div></div>
  <div id="hud">GPS Maker Lab</div>
  <div id="quick"></div>
</div>
<div id="pg"></div>
<div id="sb"><div id="sbt"></div></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.opacity=0;},1600);}

/* ------------------------------------------------------------------ pixel font (5 x 5) */
const FR={A:'01110,10001,11111,10001,10001',B:'11110,10001,11110,10001,11110',C:'01111,10000,10000,10000,01111',D:'11110,10001,10001,10001,11110',E:'11111,10000,11110,10000,11111',F:'11111,10000,11110,10000,10000',G:'01111,10000,10011,10001,01111',H:'10001,10001,11111,10001,10001',I:'01110,00100,00100,00100,01110',J:'00111,00010,00010,10010,01100',K:'10001,10010,11100,10010,10001',L:'10000,10000,10000,10000,11111',M:'10001,11011,10101,10001,10001',N:'10001,11001,10101,10011,10001',O:'01110,10001,10001,10001,01110',P:'11110,10001,11110,10000,10000',Q:'01110,10001,10101,10010,01101',R:'11110,10001,11110,10010,10001',S:'01111,10000,01110,00001,11110',T:'11111,00100,00100,00100,00100',U:'10001,10001,10001,10001,01110',V:'10001,10001,10001,01010,00100',W:'10001,10001,10101,11011,10001',X:'10001,01010,00100,01010,10001',Y:'10001,01010,00100,00100,00100',Z:'11111,00010,00100,01000,11111',
'0':'01110,10011,10101,11001,01110','1':'00100,01100,00100,00100,01110','2':'01110,10001,00110,01000,11111','3':'11110,00001,01110,00001,11110','4':'10010,10010,11111,00010,00010','5':'11111,10000,11110,00001,11110','6':'01110,10000,11110,10001,01110','7':'11111,00001,00010,00100,00100','8':'01110,10001,01110,10001,01110','9':'01110,10001,01111,00001,01110',
'!':'00100,00100,00100,00000,00100','?':'01110,10001,00110,00000,00100','.':'00000,00000,00000,00000,00100','-':'00000,00000,11111,00000,00000',':':'00000,00100,00000,00100,00000','+':'00000,00100,01110,00100,00000','%':'11001,11010,00100,01011,10011',"'":'00100,00100,00000,00000,00000','/':'00001,00010,00100,01000,10000'};
const GL={};for(const k in FR)GL[k]=FR[k].split(',').join('');
const tw=(t,k)=>t.length?t.length*6*k-k:0;

/* ------------------------------------------------------------------ settings */
const ALERTS=[['dog','DOG'],['sheep','SHEEP'],['bridge','BRIDGE'],['hazard','ROAD HAZARD'],['fuel','LOW FUEL'],['worn','WORN BIKE'],['item','ITEM']];
const mkA=(text,bg,fg,b,d,order)=>({on:1,text,bg,fg,buzz:Object.assign({on:0,pitch:150,len:1.2,rate:4,vol:35},b||{}),ding:Object.assign({on:0,pitch:785,n:5,gap:.2,decay:1.85,vol:50},d||{}),order:order||'then'});
const THEMES=[['#5e5e5e','#000000','#8a8a8a','#ffffff'],['#338042','#000000','#00ffff','#0000ff'],['#000000','#523333','#230026','#ff0000'],['#164039','#000000','#164039','#ffff00']];
const DEF=()=>({
  name:'HAZMAT 3000',price:0,vol:80,sound:1,
  shape:'rect',w:150,h:262,d:200,px:1,r:14,body:'#050505',bz:8,
  boot:{on:1,wait:0,bg:'#000000',txtCol:'#ffffff',logo:'robot',logoCol:'#3ddc84',l1:'CYBORDINE',l2:'AUTO',l3:'',touch:'TOUCH TO|SWITCH|COLOUR',touchCol:'#cfd8dc'},
  map:{on:1,bg:'#5e5e5e',road:'#000000',rail:'#8a8a8a',arrow:'#ffffff',roadW:7,curve:60,speed:40,ticks:1,marks:1,idle:0},
  bar:{pct:16,pos:'top',txt:100,rate:1,flash:'text',edge:1,multi:'stack',cycle:1.2,stagger:0},
  alerts:{
    dog:mkA('DOG','#d11a1a','#ffffff',{on:1}),
    sheep:mkA('SHEEP','#e07a10','#000000',{on:1,pitch:190,len:1.0,rate:5}),
    bridge:mkA('BRIDGE','#1f5fbf','#ffffff',{on:0},{on:1,pitch:660,n:2,gap:.3,decay:1.2}),
    hazard:mkA('DANGER','#d11a1a','#ffffff',{on:1}),
    fuel:mkA('LOW FUEL','#f2b200','#000000',{on:1,pitch:220,len:.8,rate:6}),
    worn:mkA('WORN OUT','#7a2db5','#ffffff',{on:1,pitch:110,len:1.0,rate:3}),
    item:mkA('PHOTO','#12a24a','#ffffff',{on:0},{on:1})
  }
});
let P=DEF();
function merge(d,s){for(const k in s){if(!(k in d))continue;if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k]))merge(d[k],s[k]);else if(typeof s[k]===typeof d[k])d[k]=s[k];}}

/* ------------------------------------------------------------------ audio */
let AC=null,MG=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();MG.gain.value=P.vol/100;return AC;}
function buzz(b,delay){const c=P.sound&&ac();if(!c)return;const t=c.currentTime+.02+(delay||0),L=b.len,out=c.createGain(),lp=c.createBiquadFilter(),gate=c.createGain();lp.type='lowpass';lp.frequency.value=2600;out.gain.value=b.vol/100;gate.gain.value=0;
  for(const f of[b.pitch,b.pitch*1.06]){const o=c.createOscillator();o.type='square';o.frequency.value=f;o.connect(gate);o.start(t);o.stop(t+L+.05);}
  gate.connect(lp);lp.connect(out);out.connect(MG);const per=1/Math.max(.5,b.rate);gate.gain.setValueAtTime(0,t);for(let x=0;x<L;x+=per){gate.gain.setValueAtTime(1,t+x);gate.gain.setValueAtTime(0,t+Math.min(L,x+per*.55));}gate.gain.setValueAtTime(0,t+L);}
function ding(d,delay){const c=P.sound&&ac();if(!c)return;const t0=c.currentTime+.02+(delay||0),n=Math.max(1,d.n|0);
  for(let i=0;i<n;i++){const t=t0+i*d.gap,f=i===0&&n>1?d.pitch*.75:d.pitch,g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(d.vol/100,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d.decay);g.connect(MG);
    [[1,1],[2.76,.35],[5.4,.12]].forEach(([m,a])=>{const o=c.createOscillator(),pg=c.createGain();o.type='sine';o.frequency.value=f*m;pg.gain.value=a;o.connect(pg);pg.connect(g);o.start(t);o.stop(t+d.decay+.05);});}}
function playAlertSound(a,d0){d0=d0||0;const bo=a.buzz.on,dn=a.ding.on;if(bo)buzz(a.buzz,d0);if(dn)ding(a.ding,d0+((bo&&a.order==='then')?a.buzz.len:0));}

/* ------------------------------------------------------------------ drawing */
const rgb=h=>{const n=parseInt(String(h).slice(1),16)||0;return(0xff000000|((n&255)<<16)|(n&0xff00)|(n>>16))>>>0;};
const mix=(a,b,t)=>{const r=(a&255)*(1-t)+(b&255)*t,g=((a>>8)&255)*(1-t)+((b>>8)&255)*t,bl=((a>>16)&255)*(1-t)+((b>>16)&255)*t;return(0xff000000|((bl|0)<<16)|((g|0)<<8)|(r|0))>>>0;};
let PW=150,PH=262,img=null,buf=null,cx=null;
const cv=$('cv');
function R(x,y,w,h,c){for(let j=0;j<h;j++){const py=y+j;if(py<0||py>=PH)continue;for(let i=0;i<w;i++){const px=x+i;if(px>=0&&px<PW)buf[py*PW+px]=c;}}}
function text(t,x,y,k,c){for(const ch of t){const g=GL[ch];if(g){for(let r=0;r<5;r++)for(let q=0;q<5;q++)if(g[r*5+q]==='1')R(x+q*k,y+r*k,k,k,c);}x+=6*k;}}
function textC(t,y,k,c){text(t,Math.round((PW-tw(t,k))/2),y,k,c);}
function dim(k){for(let i=0;i<buf.length;i++){const c=buf[i];buf[i]=(0xff000000|(((((c>>16)&255)*k)|0)<<16)|(((((c>>8)&255)*k)|0)<<8)|(((c&255)*k)|0))>>>0;}}
function dims(){return P.shape==='round'?{w:P.d,h:P.d}:{w:P.w,h:P.h};}
function layout(){
  const D=dims();PW=Math.max(24,Math.round(D.w/P.px));PH=Math.max(24,Math.round(D.h/P.px));
  cv.width=PW;cv.height=PH;cx=cv.getContext('2d');img=cx.createImageData(PW,PH);buf=new Uint32Array(img.data.buffer);
  cv.style.width=D.w+'px';cv.style.height=D.h+'px';
  const g=$('gad');g.style.padding=P.bz+'px';g.style.background=P.body;
  const rad=P.shape==='round'?'50%':P.r+'px';g.style.borderRadius=P.shape==='round'?'50%':(P.r+P.bz)+'px';cv.style.borderRadius=rad;
  fit();
}
function fit(){
  const g=$('gad'),st=$('stage'),W=D0().w+2*P.bz,H=D0().h+2*P.bz;
  const aw=Math.max(60,innerWidth-24),ah=Math.max(120,innerHeight*.5-70);const s=Math.min(1,aw/W,ah/H);
  g.style.transform='scale('+s+')';g.style.marginBottom=(-(1-s)*H)+'px';g.style.width=W+'px';
  st.style.height=Math.round(H*s+12)+'px';st.style.paddingTop='6px';
  function D0(){return dims();}
}
/* map */
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
let scrollP=0,lastT=0;
function drawMap(t,dt){
  const M=P.map,BG=rgb(M.bg),RD=rgb(M.road),RAIL=rgb(M.rail),ARW=rgb(M.arrow),WHITE=0xffffffff;
  buf.fill(BG);
  if(!M.on){if(M.idle){const k=Math.max(1,Math.min(3,Math.floor((PW-10)/Math.max(1,P.name.length*6-1))));textC(P.name.toUpperCase(),Math.round(PH/2-2.5*k),k,mix(BG,WHITE,.28));}return;}
  scrollP+=dt*M.speed*3;const stretch=2.2,riderRow=PH-Math.round(PH*.12),roadW=Math.max(3,PW*M.roadW/100),amp=PW*.2*M.curve/100;
  const xs=new Float32Array(PH);
  for(let y=0;y<PH;y++){
    const u=(riderRow-y)/riderRow,d=scrollP+(riderRow-y)*stretch,c=Math.sin(d*.045+1)*.62+Math.sin(d*.0195+2)*.38,ramp=clamp(u*3,0,1);
    const x=PW/2+amp*c*ramp;xs[y]=x;const h=Math.max(1.5,roadW/2*(1-.3*clamp(u,0,1.2)));
    const a=Math.round(x-h),b=Math.round(x+h);
    if(M.rail&&h>2.5){R(a-1,y,1,1,RAIL);R(b+1,y,1,1,RAIL);}
    for(let q=Math.max(0,a);q<=Math.min(PW-1,b);q++)buf[y*PW+q]=RD;
    if(M.ticks&&y>0&&Math.floor(d/200)!==Math.floor((d-stretch)/200)&&y<riderRow){const G=mix(BG,RD,.14);for(let q=0;q<PW;q+=2)buf[y*PW+q]=G;}
    if(M.marks&&y<riderRow-6){const k1=Math.floor(d/260),k0=Math.floor((d-stretch)/260);if(k1!==k0){const hv=hash(k1);if(hv<.4){const col=hv<.2?rgb('#e5483c'):rgb('#14a84b');R(Math.round(x)-2,y-2,5,5,col);}}}
  }
  const ax=Math.round(xs[clamp(riderRow,0,PH-1)]),AH=Math.max(9,Math.round(PW*.1));
  for(let pass=0;pass<2;pass++){const o=pass?0:1;for(let k=-o;k<AH+o;k++){const half=Math.max(0,Math.round((k+.5)*.5))+o;for(let q=-half;q<=half;q++){const px=ax+q,py=riderRow-Math.round(AH/2)+k;if(px>=0&&px<PW&&py>=0&&py<PH)buf[py*PW+px]=pass?ARW:WHITE;}}}
}
/* boot */
function drawBoot(tb){
  const B=P.boot,K=rgb(B.bg),Wt=rgb(B.txtCol);buf.fill(K);
  if(tb<.5)return false;
  const tl0=String(B.touch||'').toUpperCase().split('|').filter(s=>s.length);
  if(tl0.length&&tb>=2.4){                      // logo and title are cleared first, then the touch prompt has the screen to itself
    if(tb>=2.8){const C=rgb(B.touchCol),k2=Math.max(1,Math.min(3,Math.floor((PW-8)/Math.max(1,Math.max(...tl0.map(s=>s.length*6-1)))))),step=k2*7+3;let y=Math.round((PH-tl0.length*step+3)/2);
      for(const s of tl0){textC(s,y,k2,C);y+=step;}}
    return true;}
  const f=clamp((tb-.5)/.8,0,1),TX=mix(K,Wt,f),LG=mix(K,rgb(B.logoCol),f),u=Math.max(1,Math.floor(Math.min(PW/27,PH/48))),cxm=Math.round(PW/2);
  let y0=Math.round(PH*.08),ty;
  if(B.logo==='robot'){const y=y0,Gc=LG;
    R(cxm-4*u,y,u,u,Gc);R(cxm-3*u,y+u,u,u,Gc);R(cxm+3*u,y,u,u,Gc);R(cxm+2*u,y+u,u,u,Gc);
    R(cxm-4*u,y+2*u,8*u,5*u,Gc);R(cxm-2*u,y+4*u,u,u,K);R(cxm+u,y+4*u,u,u,K);
    R(cxm-4*u,y+8*u,8*u,7*u,Gc);R(cxm-7*u,y+8*u,2*u,6*u,Gc);R(cxm+5*u,y+8*u,2*u,6*u,Gc);
    R(cxm-3*u,y+15*u,2*u,4*u,Gc);R(cxm+u,y+15*u,2*u,4*u,Gc);ty=y+20*u+Math.round(PH*.03);}
  else ty=Math.round(PH*.28);
  const lines=[B.l1,B.l2,B.l3].map(s=>String(s||'').toUpperCase()).filter(s=>s.length);
  for(const s of lines){const k=Math.max(1,Math.min(4,Math.floor((PW-8)/(s.length*6-1))));textC(s,ty,k,TX);ty+=k*7;}
  return true;
}
/* alert bar */
let AL=[];      // active alerts: [{id,t0,hold}]
function drawOne(e,t,y0,bh){
  const a=P.alerts[e.id];if(!a)return;
  const B=P.bar,tt=(t-e.t0),fl=(tt*B.rate)%1<.62,BG=rgb(a.bg),FG=rgb(a.fg);
  const barOn=(B.flash==='bar'||B.flash==='both')?fl:true,txtOn=(B.flash==='text'||B.flash==='both')?fl:true;
  if(barOn){R(0,y0,PW,bh,BG);if(B.edge){const E=mix(BG,0xff000000,.35);if(y0+bh<PH)R(0,y0+bh,PW,1,E);if(y0>0)R(0,y0-1,PW,1,E);}}
  if(barOn&&txtOn){
    const lines=String(a.text||'').toUpperCase().split('|'),n=lines.length,mx=Math.max(1,...lines.map(s=>s.length)),pad=Math.max(2,Math.round(bh*.12));
    let k=Math.floor(Math.min((PW-2*pad)/Math.max(1,mx*6-1),(bh-2*pad)/(n*5+(n-1))));k=Math.max(1,Math.floor(k*B.txt/100));
    const th=n*5*k+(n-1)*k,ty=y0+Math.round((bh-th)/2);
    lines.forEach((s,i)=>{if(s.length)textC(s,ty+i*6*k,k,FG);});}
}
function drawBar(t){
  if(!AL.length)return;const B=P.bar;let bh=Math.max(8,Math.round(PH*B.pct/100));
  const place=(h,i,n)=>{const tot=h*n;return B.pos==='top'?i*h:B.pos==='bottom'?PH-tot+i*h:Math.round((PH-tot)/2)+i*h;};
  if(AL.length===1||B.multi==='off'){const e=AL[AL.length-1];drawOne(e,t,place(bh,0,1),bh);return;}
  if(B.multi==='cycle'){const e=AL[Math.floor(t/Math.max(.3,B.cycle))%AL.length];drawOne(e,t,place(bh,0,1),bh);return;}
  const n=AL.length;bh=Math.max(8,Math.min(bh,Math.floor(PH/n)));
  AL.forEach((e,i)=>drawOne(e,t,place(bh,i,n),bh));
}
/* main scene */
let bootT0=performance.now()/1000,bootRun=true,bootDone=false,fadeT=0;
function runBoot(){bootT0=performance.now()/1000;bootRun=true;bootDone=false;}
function frame(){
  const t=performance.now()/1000,dt=Math.min(.1,t-(lastT||t));lastT=t;
  if(!buf){requestAnimationFrame(frame);return;}
  let mode='map';
  if(P.boot.on&&bootRun){const tb=t-bootT0;mode='boot';
    if(!P.boot.wait&&tb>=4.6){fadeT=clamp((tb-4.6)/1.2,0,1);mode='fade';if(fadeT>=1){bootRun=false;}}
  }
  if(mode==='boot'){drawBoot(t-bootT0);}
  else if(mode==='fade'){drawMap(t,dt);const f=fadeT;const B=P.boot,K=rgb(B.bg);for(let i=0;i<buf.length;i++)buf[i]=mix(K,buf[i],f);}
  else drawMap(t,dt);
  AL=AL.filter(e=>e.hold||t-e.t0<=3.6);
  drawBar(t);
  cx.putImageData(img,0,0);
  $('hud').textContent=(P.name||'GPS')+'  |  '+(mode==='boot'?'BOOT '+(t-bootT0).toFixed(1)+'s'+(P.boot.wait?'  (tap the screen)':''):mode==='fade'?'STARTING':P.map.on?'MAP ON':'MAP OFF')+(AL.length?'  |  ALERT: '+AL.map(e=>P.alerts[e.id].text.replace('|',' / ')+(e.hold?'*':'')).join(' + '):'');
  requestAnimationFrame(frame);
}
$('gad').addEventListener('pointerdown',()=>{if(P.boot.on&&bootRun&&P.boot.wait&&performance.now()/1000-bootT0>2.2){bootRun=false;toast('tapped: map starts');}
  else{const i=THEMES.findIndex(T=>T[0]===P.map.bg&&T[1]===P.map.road);const n=THEMES[(i+1)%THEMES.length];setTheme(n);}});

/* ------------------------------------------------------------------ alert control */
function trigger(id,hold,keep){const a=P.alerts[id];if(!a)return;if(!a.on){toast(a.text+' alert is switched off');return;}
  const t=performance.now()/1000,multi=P.bar.multi!=='off';
  if(!(multi&&keep!==false)&&keep!==true)AL=[];
  AL=AL.filter(e=>e.id!==id);AL.push({id,t0:t,hold:!!hold});
  const d=AL.length>1?(P.bar.stagger||0)*(AL.length-1):0;playAlertSound(a,d);}
function triggerAll(hold){stopAll();let k=0;for(const[id]of ALERTS){if(!P.alerts[id].on)continue;const a=P.alerts[id],t=performance.now()/1000;AL.push({id,t0:t,hold:!!hold});playAlertSound(a,(P.bar.stagger||0)*k);k++;}if(!k)toast('no alerts are switched on');}
let demoT=[];
function stopAll(){AL=[];demoT.forEach(clearTimeout);demoT=[];}
function demoAll(){stopAll();let i=0;for(const[id]of ALERTS){if(!P.alerts[id].on)continue;demoT.push(setTimeout(()=>trigger(id,false),i*3800));i++;}demoT.push(setTimeout(()=>{runBoot();},i*3800));toast('demo: each alert, then the boot screen');}

/* ------------------------------------------------------------------ UI builders */
const pg=$('pg'),refs=[];
function h3(t){const e=document.createElement('h3');e.textContent=t;pg.appendChild(e);}
function card(){const c=document.createElement('div');c.className='card';pg.appendChild(c);return c;}
function sub(c,t){const e=document.createElement('div');e.className='sub';e.textContent=t;c.appendChild(e);}
function note(c,t){const e=document.createElement('div');e.className='small';e.textContent=t;c.appendChild(e);}
function btn(c,t,fn,cls){const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=fn;return b;}
function row(c){const r=document.createElement('div');r.className='row';c.appendChild(r);return r;}
function sl(c,label,min,max,step,get,set,fmt){
  const w=document.createElement('div');w.className='sl';const nm=document.createElement('div');nm.className='nm';const l=document.createElement('span'),v=document.createElement('b');nm.append(l,v);
  const rw=document.createElement('div');rw.className='rw';const m=btn(rw,'−',null,'sq'),i=document.createElement('input'),p=btn(rw,'+',null,'sq');i.type='range';i.min=min;i.max=max;i.step=step;
  rw.append(m,i,p);w.append(nm,rw);c.appendChild(w);
  const dec=Math.max(0,(String(step).split('.')[1]||'').length);
  const paint=()=>{l.textContent=label;i.value=get();v.textContent=fmt?fmt(+get()):(+get()).toFixed(dec);};
  const setv=x=>{x=clamp(Math.round(x/step)*step,min,max);set(+x.toFixed(4));paint();};
  i.oninput=()=>setv(+i.value);m.onclick=()=>setv(+get()-step);p.onclick=()=>setv(+get()+step);paint();refs.push(paint);return paint;
}
function colour(c,label,get,set){const r=row(c);const d=document.createElement('div');d.className='grow';d.textContent=label;const i=document.createElement('input');i.type='color';r.append(d,i);
  const paint=()=>{i.value=get();};i.oninput=()=>set(i.value);paint();refs.push(paint);}
function textIn(c,label,get,set,ph){const r=row(c);const d=document.createElement('div');d.textContent=label;d.style.minWidth='64px';const i=document.createElement('input');i.type='text';if(ph)i.placeholder=ph;r.append(d,i);
  const paint=()=>{i.value=get();};i.oninput=()=>set(i.value);paint();refs.push(paint);}
function seg(c,label,opts,get,set){const r=row(c);if(label){const d=document.createElement('div');d.textContent=label;d.style.minWidth='64px';r.appendChild(d);}
  const bs=opts.map(([v,t])=>{const b=btn(r,t,()=>{set(v);paint();},'grow');r.appendChild(b);return[v,b];});
  const paint=()=>bs.forEach(([v,b])=>b.classList.toggle('on',get()===v));paint();refs.push(paint);}
function toggle(c,label,get,set){const b=btn(c,'',()=>{set(get()?0:1);paint();},'grow');const paint=()=>{b.textContent=label+': '+(get()?'ON':'OFF');b.classList.toggle('on',!!get());};paint();refs.push(paint);return b;}

/* quick trigger bar (always on screen) */
(function(){const q=$('quick');
  const add=(t,fn,cls)=>{const b=document.createElement('button');b.textContent=t;b.onclick=fn;if(cls)b.className=cls;q.appendChild(b);};
  add('BOOT',()=>{runBoot();});
  const mb=document.createElement('button');q.appendChild(mb);const mp=()=>{mb.textContent='MAP: '+(P.map.on?'ON':'OFF');mb.classList.toggle('pri',!P.map.on);};mb.onclick=()=>{P.map.on=P.map.on?0:1;refs.forEach(f=>f());};mp();refs.push(mp);
  const qb={};
  for(const[id,nm]of ALERTS){add(nm.split(' ').pop(),()=>trigger(id,false));qb[id]=q.lastChild;}
  refs.push(()=>{for(const id in qb)qb[id].style.display=P.alerts[id].on?'':'none';});
  add('ALL',()=>triggerAll(false));
  add('STOP',()=>stopAll(),'pri');
})();

  const paint=()=>bs.forEach(([id,nm,b])=>{const on=P.alerts[id].on;b.textContent=(on?'☑  ':'☐  ')+nm+'  —  '+(P.alerts[id].text||'').replace('|',' ')+(on?'':'  (OFF)');b.classList.toggle('on',!!on);});paint();refs.push(paint);

let selA='dog';
(function(){const c=card();

/* ------------------------------------------------------------------ scroll bar (left, 20px) */
(function(){const sb=$('sb'),th=$('sbt'),top=$('top');
  function lay(){const t=top.getBoundingClientRect().height;sb.style.top=t+'px';const H=sb.clientHeight,vh=innerHeight,dh=document.documentElement.scrollHeight;
    const max=Math.max(1,dh-vh),thh=Math.max(40,H*(vh-t)/Math.max(dh-t,1));th.style.height=thh+'px';
    th.style.top=(max>1?scrollY/max*(H-thh):0)+'px';sb.style.display=dh>vh+4?'block':'none';}
  let drag=false,off=0;
  function setFrom(y){const r=sb.getBoundingClientRect(),H=sb.clientHeight,thh=th.offsetHeight,max=document.documentElement.scrollHeight-innerHeight;
    const f=clamp((y-r.top-off)/Math.max(1,H-thh),0,1);scrollTo(0,f*max);}
  sb.addEventListener('pointerdown',e=>{drag=true;sb.setPointerCapture(e.pointerId);const tr=th.getBoundingClientRect();off=(e.clientY>=tr.top&&e.clientY<=tr.bottom)?e.clientY-tr.top:tr.height/2;setFrom(e.clientY);e.preventDefault();});
  sb.addEventListener('pointermove',e=>{if(drag)setFrom(e.clientY);});
  sb.addEventListener('pointerup',()=>{drag=false;});sb.addEventListener('pointercancel',()=>{drag=false;});
  addEventListener('scroll',lay,{passive:true});addEventListener('resize',lay);setInterval(lay,500);lay();})();

window.__GPSLAB={get P(){return P;},trigger,triggerAll,get AL(){return AL;},runBoot,setP:o=>{P=DEF();merge(P,o);layout();refs.forEach(f=>f());}};
