<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Post and Phone Box Lab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#8dff6a;--bg:#0b0d0a;--p1:#14180f;--ln:#262c21;--tx:#e8ece4;--dim:#8a9484}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.25 system-ui,sans-serif;touch-action:manipulation}
header{background:var(--bg);padding:6px 10px 8px 40px;border-bottom:1px solid var(--ln)}
#sw{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 10px 6px 40px;border-bottom:1px solid var(--ln)}
.chipwrap{padding:0 10px 8px 40px;border-bottom:1px solid var(--ln)}
#sw.free{position:static}
.ttl{display:flex;justify-content:space-between;align-items:center;margin:0 0 5px}
h1{margin:0;font-size:13px;letter-spacing:.14em;color:var(--g);font-weight:700}
#stage{position:relative;width:min(calc(100vw - 56px),176px);aspect-ratio:3/4;overflow:hidden;border:3px solid #333;border-radius:6px;background:#222;user-select:none;-webkit-user-select:none}
#strip{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#pops2{position:absolute;left:0;right:0;bottom:4px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6}
#pops.low{top:auto;bottom:34px}
#pops{position:absolute;left:0;right:0;top:6px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6}
.pop{image-rendering:pixelated;opacity:0;transform:translateY(-8px) scale(.9);transition:opacity .18s,transform .18s}
.pop.in{opacity:1;transform:none}
.pop.blink{animation:bl .5s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:.2}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
#pol{position:absolute;left:50%;top:48%;z-index:5;pointer-events:none;image-rendering:pixelated;display:none;transform-origin:50% 50%;filter:drop-shadow(0 3px 5px #000a)}
#rd{position:absolute;left:5px;top:4px;font:700 11px ui-monospace,monospace;color:#fff;white-space:pre;z-index:4;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
#hud{position:absolute;left:5px;bottom:5px;font:700 11px ui-monospace,monospace;color:#ffd23a;z-index:4;text-shadow:0 1px 2px #000}
#horn{position:absolute;right:5px;bottom:5px;width:46px;height:46px;border-radius:50%;border:2px solid #ddd;background:#111;color:#ff4a3a;font:800 9px system-ui;z-index:4;letter-spacing:.04em}
#horn:active,#horn.hit{background:#ff4a3a;color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:6px 0 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none}
button.s{background:var(--p1);color:var(--tx);border:1px solid #333b2d;border-radius:999px;padding:0 11px;height:30px;font:600 11px system-ui;letter-spacing:.03em;white-space:nowrap}
button.s:active{background:#2b3326}
button.s.on{background:var(--g);color:#0b0d0a;border-color:var(--g)}
button.s.go{border-color:#ffd23a;color:#ffd23a}
main{padding:4px 12px 16px 82px}
#sb{position:fixed;left:4px;width:28px;z-index:6;background:#12160f;border:1px solid #2f3629;border-radius:14px;touch-action:none}
#sbt{position:absolute;left:2px;right:2px;top:0;min-height:64px;border-radius:12px;background:linear-gradient(90deg,#8dff6a,#4fa83a);box-shadow:0 0 0 1px #0007 inset}
.sec{border-bottom:1px solid var(--ln)}
.sh{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:#ffd23a;font:700 11px system-ui;letter-spacing:.14em;text-transform:uppercase;padding:11px 0 9px;text-align:left}
.sh i{font-style:normal;color:var(--dim);transition:transform .15s}.sec.open .sh i{transform:rotate(90deg)}
.sb{display:none;padding-bottom:6px}.sec.open .sb{display:block}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:22px;margin:0;touch-action:none;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--g) var(--p),#2a3125 var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#2a3125}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--g)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#e9ffe0;border:2px solid var(--g);margin-top:-7px;box-shadow:0 1px 4px #000a}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e9ffe0;border:2px solid var(--g)}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0 1px}
.sl span.n{font-size:12px;color:#cfd6c8;line-height:1.2}.sl span.v{font:600 12px ui-monospace,monospace;color:var(--g);text-align:right}
.sl input{grid-column:1/3}
.blocks{display:flex;gap:4px;flex-wrap:wrap;padding:5px 0 7px}
.blocks button{padding:6px 9px;background:var(--p1);color:var(--tx);border:1px solid #333b2d;font:600 11px system-ui;border-radius:999px}
.blocks button.on{background:var(--g);color:#0b0d0a}
.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
textarea{width:100%;height:90px;background:#050605;color:#bfe;border:1px solid var(--ln);border-radius:10px;font:11px ui-monospace,monospace;padding:8px}
.note{font-size:11px;color:var(--dim);margin:4px 0}
#prev{display:block;image-rendering:pixelated;width:min(100%,192px);margin:8px 0;border-radius:2px}
@media (max-width:400px){main{padding-left:82px;padding-right:8px}header,#sw,.chipwrap{padding-left:36px;padding-right:8px}.sh{font-size:10px;letter-spacing:.1em}}
.pxt{display:inline-block;vertical-align:middle;background:currentColor;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#rd .pxt,#hud .pxt{filter:drop-shadow(0 1px 0 #000)}
h1 .pxt{vertical-align:top}.sl .n .pxt,.note .pxt{vertical-align:top}
#rd{white-space:normal}
</style></head><body>
<header id="hd"><div class="ttl"><h1>POST AND PHONE BOX LAB</h1><button class="s" id="pin">PINNED</button></div></header>
<div id="sw"><div id="stage"><canvas id="strip" width="100" height="133"></canvas><div id="pops"></div><div id="flash"></div><canvas id="pol"></canvas><div id="rd"></div><div id="hud"></div><button id="horn">HORN</button></div></div>
<div class="chipwrap"><div class="chips" id="seq"></div>
<div class="chips" id="typ"></div></div>
<main id="main"></main>
<main style="padding-top:0">
<div class="sh" style="cursor:default">Copy settings</div>
<div class="row"><button class="s" id="copy">COPY SETTINGS</button><button class="s" id="rst">RESET</button></div>
<textarea id="out" spellcheck="false" readonly inputmode="none"></textarea>
<p class="note">The photo scenery follows the level you pick, so there are no scene sliders. Press RANDOM for a different one. The timing, sound and payout sliders are what go in the game.</p>
</main>
<script>
// =============== helpers ===============
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const toHx=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return toHx(x.map((v,i)=>v+(y[i]-v)*t));};
const lighten=(c,t)=>mix(c,'#ffffff',t),darken=(c,t)=>mix(c,'#000000',t);
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return toHx([f(0)*255,f(8)*255,f(4)*255]);}
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hh=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// =============== settings ===============
const DEF={zoomT:.7,spins:1,tilt:5,holdT:3.5,devT:2.5,flashI:85,popT:2.2,warnT:4.5,vol:82,shutL:91,whirL:11,ringL:81,ringP:100,hornP:117,photoMin:100,photoMax:250,letterPay:50,letters:5};
const cfg=Object.assign({},DEF);
const LEVELS=[
 {id:'urban',name:'URBAN',sky:[205,70,70],ground:'#7c7c80',kind:'town'},
 {id:'farm',name:'FARM',sky:[203,68,68],ground:'#5f9a3e',kind:'farm'},
 {id:'forest',name:'FOREST',sky:[200,50,62],ground:'#3f6b34',kind:'forest'},
 {id:'lane1',name:'LANE 1',sky:[208,55,70],ground:'#7a6a3a',kind:'heath'},
 {id:'lane2',name:'LANE 2',sky:[210,45,66],ground:'#8a7f66',kind:'moor'},
 {id:'pine',name:'PINE',sky:[205,45,60],ground:'#6a5a44',kind:'pine'},
 {id:'industrial',name:'INDUSTRIAL',sky:[210,12,62],ground:'#6f6f72',kind:'ind'},
 {id:'wetlands',name:'WETLANDS',sky:[200,40,78],ground:'#8a9a5a',kind:'wet'},
 {id:'street',name:'STREET RACE',sky:[208,60,64],ground:'#55555a',kind:'street'},
 {id:'autumn',name:'AUTUMN FOREST',sky:[35,45,72],ground:'#8a5a2a',kind:'autumn'}];
const BOXES={post:['PILLAR BOX','WALL BOX'],phone:['K6 PHONE BOX','MODERN PHONE BOX']};
const TODS=['DAY','OVERCAST','DUSK','DAWN'];
const S={level:0,type:'post',variant:0,side:1,tod:0,seed:1,gold:false,photoNo:12};
// =============== the photo (side view, 80 x 58, painted from the level) ===============
const PW=80,PH=58,HZ=42,FOOT=50;
const TANKS=[['#14151a','#5a5d6a','#3a3d48','#c9a24a'],['#b3201a','#ee6a5a','#d8443a','#e8d9a0'],['#1c2f6a','#5a7ad0','#3a54a0','#c9a24a'],['#ecebe4','#ffffff','#cfcdc2','#8a2a2a'],['#7a7d86','#b4b7c0','#9a9da6','#2a2a2e'],['#e6b81c','#fff29a','#f0d040','#2a2a2e'],['#1f6b3a','#58b070','#3a8a54','#d8c070']];
function drawBike(R,ox,oy,flip,o){o=o||{};const W=40,P=(x,y,w,h,c)=>R(c,flip?ox+W-x-w:ox+x,oy+y,w,h);
 const CH='#c9ccd4',CH2='#8d9199',BK='#14151a',BK2='#2a2b30',GL='#5a5d6a';
 const line=(x0,y0,x1,y1,c)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)P(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1,c);};
 const wheel=(cx,cy,disc)=>{for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++){const d=Math.hypot(x,y);let c=null;
   if(d<=5.6)c='#0e0f12';if(d<=4.4)c='#aeb2ba';if(d<=3.6)c='#1c1d22';if(d<=1.5)c='#c9ccd4';
   if(c)P(cx+x,cy+y,1,1,c);}
  for(let a=0;a<5;a++){const t=a*Math.PI*2/5+.3;line(cx+Math.cos(t)*1.5,cy+Math.sin(t)*1.5,cx+Math.cos(t)*4,cy+Math.sin(t)*4,'#8d9199');}
  if(disc){P(cx-2,cy-2,4,4,'#3a3c42');P(cx-1,cy-1,2,2,'#9a9ca4');}};
 wheel(8,16,0);
 // swingarm, shock
 P(8,16,10,1,BK2);P(9,17,8,1,'#0e0f12');
 line(11,9,9,15,CH);line(12,9,10,15,'#444');P(11,10,2,1,'#222');P(10,12,2,1,'#222');
 // tail + seat
 P(4,7,6,1,BK);P(3,7,1,2,'#e23a2a');P(4,8,5,1,'#0e0f12');
 P(9,7,12,1,'#3a2c1e');P(10,6,10,1,'#2a2016');P(9,8,10,1,'#14100c');
 // bag
 if(o.bag){P(10,8,9,6,'#1b1c20');P(10,8,9,1,'#2c2d33');P(12,8,1,6,'#3a3a40');P(16,8,1,6,'#3a3a40');P(10,13,9,1,'#0a0a0c');P(11,9,3,1,'#2c2d33');}
 else{P(12,9,6,4,BK);P(12,9,6,1,'#2e3036');P(13,11,4,1,'#8a8d96');}
 // engine
 P(17,12,10,5,'#3a3c42');P(17,12,10,1,'#6a6c74');
 for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++){const d=Math.hypot(x,y);if(d<=3.6)P(22+x,15+y,1,1,d<2.2?'#7e8189':'#c9ccd4');}
 P(21,14,2,2,'#2c2d32');
 P(21,8,7,5,'#2c2d32');for(let y=9;y<=12;y+=1)P(21,y,7,1,y%2?'#2c2d32':'#7a7d85');P(21,8,7,1,'#4c4e55');
 // tank (teardrop)
 const TK=o.tank||['#14151a','#5a5d6a','#3a3d48','#c9a24a'];P(22,4,6,1,TK[0]);P(21,5,9,1,TK[0]);P(20,6,11,2,TK[0]);P(21,8,8,1,TK[0]);P(20,7,11,1,TK[4]||TK[0]);
 P(23,5,5,1,TK[1]);P(22,6,3,1,TK[2]);P(25,7,2,1,TK[3]);
 // exhaust
 P(26,12,2,6,CH2);P(15,18,13,1,'#aeb2ba');P(15,17,2,1,CH2);
 P(4,14,12,3,CH2);P(4,14,12,1,'#eef0f4');P(4,16,12,1,'#5e6169');P(3,14,1,3,'#0a0a0c');P(8,14,1,3,'#444');P(12,14,1,3,'#444');
 // front wheel
 wheel(32,16,1);
 // fork
 line(35,7,34,17,CH);line(36,7,35,17,'#9a9ca4');P(34,10,2,3,'#222');
 P(28,10,9,1,BK);P(29,9,6,1,BK);P(31,9,4,1,GL);P(36,10,1,1,'#ffb020');
 // bars, lever, mirror
 P(28,3,6,1,'#222');P(27,3,1,1,'#111');P(34,3,3,1,'#999');P(35,4,1,3,'#999');
 P(29,1,1,2,'#999');P(27,-1+1,5,1,BK2);P(28,0,3,1,'#8fb4c8');
 // headlight
 P(34,5,4,5,CH);P(36,6,2,3,o.lit?'#fff6c8':'#ece4b4');P(34,5,1,5,BK2);P(35,5,1,1,'#fff');
 // peg, footrest
 P(15,19,3,1,'#999');
}

function paintPhoto(c,S){
  const L=LEVELS[S.level],r=mb(S.seed),R=(col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));},ri=(a,b)=>a+r()*(b-a);
  let [sh,ss,sl]=L.sky;if(S.tod===1){ss*=.25;sl-=6;}else if(S.tod===2){sh=28;ss=70;sl-=8;}else if(S.tod===3){sh=330;ss=45;sl+=2;}
  const sky=hsl(sh,ss,sl);R(sky,0,0,PW,HZ);for(let i=1;i<=3;i++)R(hsl(sh,ss,Math.min(94,sl+i*3)),0,HZ-i*7,PW,i*7);
  for(let i=0,n=2+Math.floor(r()*3);i<n;i++){const w=ri(10,22),x=ri(-4,PW-w+4),y=ri(3,16),col=S.tod===1?'#c9ced4':'#ffffff';R(col,x,y+2,w,3);R(col,x+w*.15,y,w*.6,3);R(col,x+w*.3,y-1,w*.3,2);}
  const gcol=L.ground;
  const hill=(col,base,amp,per)=>{const ph=r()*9;for(let x=0;x<PW;x++){const h=base+Math.sin(x/per+ph)*amp+Math.sin(x/(per*.43)+ph*2)*amp*.4;R(col,x,HZ-h,1,h+1);}};
  const tree=(x,y,h,col,col2)=>{R('#4a3320',x-1,y-h*.35,2,h*.35);const rr=h*.34;for(let k=0;k<4;k++){const ox=(r()-.5)*rr*1.1,oy=-h*.35-r()*h*.35;R(k%2?col:col2||col,x+ox-rr*.5,y+oy-rr*.5,rr,rr*.9);}};
  const pine=(x,y,h,col)=>{R('#4a3320',x,y-2,1,2);for(let k=0;k<4;k++){const w=Math.max(2,Math.round((h/4)*(1.9-k*.35))),yy=y-2-(k+1)*(h/4.4);R(k%2?darken(col,.12):col,x-Math.floor(w/2),yy,w,h/4+1);}R(col,x,y-h-1,1,2);};
  const hedge=(y,h,cols)=>{for(let x=0;x<PW;x+=2){const hgt=h+Math.floor(hh(x*3+S.seed)*3);R(cols[Math.floor(hh(x+S.seed)*cols.length)],x,y+h-hgt,2,hgt);}R(lighten(cols[0],.18),0,y+h-h,PW,0);};
  const wallRow=(y,h,col)=>{for(let yy=0,rw=0;yy<h;yy+=3,rw++){for(let x=(rw%2?-3:0);x<PW;x+=6){const v=hh(x*5+rw*13+S.seed);R(mix(col,v>.5?'#ffffff':'#000000',.06+v*.14),x,y+yy,5,2);}R(darken(col,.4),0,y+yy+2,PW,1);}R(lighten(col,.3),0,y-1,PW,1);};
  const fence=(y,h,col,type)=>{if(type==='chain'){R(darken(col,.2),0,y,PW,1);for(let x=0;x<PW;x+=2)for(let yy=y;yy<y+h;yy+=2)R(col,x+((yy-y)%4?1:0),yy,1,1);for(let x=2;x<PW;x+=14)R(darken(col,.4),x,y-1,1,h+1);}else{for(let x=1;x<PW;x+=3)R(col,x,y,1,h);R(col,0,y+1,PW,1);R(col,0,y+h-2,PW,1);}};
  // ---- level scenery ----
  const k=L.kind;
  if(k==='town'||k==='street'){
    for(let x=0;x<PW;x+=ri(5,9)){const h=ri(10,26);R(mix('#9fb3c8',sky,.45),x,HZ-h,ri(6,11),h);}
    let x=-4;const bricks=['#a0432e','#b5523a','#c9b79c','#f1e2b8','#8a8f96','#7a5232'];
    while(x<PW){const w=Math.round(ri(14,19)),h=Math.round(ri(17,24)),col=bricks[Math.floor(r()*bricks.length)];R(col,x,HZ-h,w,h);
      for(let i=0;i<5;i++)R(darken('#3b2a2a',-.1*i),x-1+i,HZ-h-1-i,w+2-2*i,1);R('#2e2020',x+3,HZ-h-8,3,6);
      for(let fy=HZ-h+3;fy<HZ-7;fy+=7)for(let wx=x+2;wx<x+w-3;wx+=6){R('#2b1a10',wx-1,fy-1,5,6);R(S.tod>=2?'#ffd877':'#bfe6f2',wx,fy,3,4);}
      R('#2b1a10',x+Math.floor(w/2)-1,HZ-8,4,8);R(['#b3201a','#2f5a3a','#2d4f8a','#222'][Math.floor(r()*4)],x+Math.floor(w/2),HZ-7,2,7);x+=w;}
    if(k==='street'){R('#ddd',0,HZ-6,PW,5);for(let x=0;x<PW;x+=6){R(x%12?'#2d5fa8':'#c9302a',x,HZ-5,6,3);}for(let x=2;x<PW;x+=17){R('#444',x,HZ-24,1,18);R(['#c9302a','#e8b800','#2d5fa8'][Math.floor(r()*3)],x+1,HZ-24,7,4);}
      for(let t=0;t<4;t++){const tx=ri(2,PW-8);for(let q=0;q<3;q++){R('#1a1a1a',tx+q*0,HZ-2-q*3+3,7,3);R('#eee',tx+1,HZ-1-q*3+3,5,1);}}}
    else{R('#222',0,HZ-3,PW,1);for(let x=0;x<PW;x+=3)R('#222',x,HZ-3,1,3);const lx=Math.round(ri(6,PW-6));R('#333',lx,HZ-24,1,24);R('#333',lx,HZ-24,5,1);R('#ffd877',lx+3,HZ-23,3,2);}
  }else if(k==='farm'){
    hill(mix('#8fb85a',sky,.3),9,3,13);for(let i=0;i<4;i++)R(i%2?'#c9b24a':'#7fae48',0,HZ-14+i*3,PW,3);
    const bx=Math.round(ri(6,56));R('#a8322a',bx,HZ-20,16,12);for(let i=0;i<7;i++)R('#4a3a3a',bx-1+i,HZ-27+i,18-2*i,1);R('#5a3216',bx+5,HZ-14,6,6);R('#e8d7a8',bx+7,HZ-14,2,6);
