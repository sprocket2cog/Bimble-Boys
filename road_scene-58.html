<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bimble Road Scene v3.0</title>
<style>
:root{--bg:#0f140e;--panel:#172015;--line:#2a3a26;--ink:#e8f0de;--mut:#93a889;--acc:#a6d948}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#wrap{position:relative;line-height:0}
#speedo{position:absolute;left:5px;top:5px;width:37.5%;height:auto;aspect-ratio:11/8;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}
#fuelBtn{position:absolute;left:6px;top:70px;width:30px;height:26px;padding:0;border-radius:7px;background:rgba(10,16,8,.55);border:1px solid rgba(255,255,255,.28);color:#e8f5d8;font:15px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.8}
#fsBtn{position:absolute;left:6px;top:38px;width:30px;height:26px;padding:0;border-radius:7px;background:rgba(10,16,8,.55);border:1px solid rgba(255,255,255,.28);color:#e8f5d8;font:600 15px/1 system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.8}
#fsBtn:hover{opacity:1}
html,body{overflow:hidden;height:100%}.panel{display:none!important}
#rpmBar,#wrBar{position:absolute;left:calc(5px + 37.5% * .14);width:calc(37.5% * .72);height:8px;border-radius:4px;background:rgba(8,12,6,.7);border:1px solid rgba(255,255,255,.35);box-sizing:border-box;overflow:hidden;pointer-events:none}
#rpmFill,#wrFill{position:absolute;inset:0;background:linear-gradient(90deg,#2fd25a 0%,#a6dc2a 30%,#f2d11e 52%,#ff9a1a 74%,#ff2d1a 100%)}
#rpmTxt,#wrTxt{position:absolute;left:calc(5px + 18.75%);transform:translateX(-50%);pointer-events:none}
.ctl{position:absolute;right:13px;width:var(--bs,56px);height:var(--bs,56px);box-sizing:border-box;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font:900 34px/1 system-ui,sans-serif;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;
  border:0;--face:#000;background:conic-gradient(from 210deg,#f4f4f4,#8a8a8a,#e6e6e6,#6b6b6b,#fafafa,#9a9a9a,#f4f4f4);box-shadow:0 1px 3px rgba(0,0,0,.6)}
.ctl:hover,.ctl:active,.ctl:focus{background:conic-gradient(from 210deg,#f4f4f4,#8a8a8a,#e6e6e6,#6b6b6b,#fafafa,#9a9a9a,#f4f4f4);outline:0;transform:none}
.glf{width:calc(var(--bs,56px)*.265);height:calc(var(--bs,56px)*.44);image-rendering:pixelated;pointer-events:none;display:block}
.ctl.on .glf{filter:drop-shadow(0 0 4px currentColor)}
.ctl::before{content:"";position:absolute;inset:calc(var(--bs,56px)*.06);border-radius:50%;background:var(--face);z-index:-1}
.ctl::after{content:"";position:absolute;inset:-9px;border-radius:50%}
#thr{bottom:24px;color:#27d652}#brk{bottom:calc(24px + var(--bs,56px) + 12px);color:#ff3b2e}
#thr.on{--face:#0c2a12;text-shadow:0 0 6px #27d652}
#brk.on{--face:#35100d;text-shadow:0 0 6px #ff3b2e}
.lbl{pointer-events:none;display:block}
#startBtn{bottom:calc(24px + (var(--bs,56px) + 12px)*2);color:#f2f2f2}
#startBtn.run{--face:#3a0e0c}
.sb{position:absolute;left:6px;height:26px;padding:0 7px;border-radius:7px;background:rgba(10,16,8,.62);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85}
.sb:hover{background:rgba(30,44,24,.8);opacity:1}
#exBtn,#sndBtn{display:none}#volBtn{top:102px}
.sld{display:flex;flex-direction:column;gap:3px;padding:2px 2px 6px}.sld input{width:170px;margin:0;accent-color:#8dff6a;touch-action:none;height:22px}
.mnu{position:absolute;left:6px;top:134px;display:none;flex-direction:column;gap:2px;padding:6px;border-radius:9px;background:rgba(8,14,7,.88);border:1px solid rgba(255,255,255,.3);max-height:calc(100% - 148px);overflow:auto;max-width:calc(100% - 12px);z-index:5}
.mnu.open{display:flex}
#menuSnd.open{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
.mrow{padding:5px 6px;border-radius:6px;background:transparent;border:0;display:flex;align-items:center;cursor:pointer}
.mrow:hover{background:rgba(120,170,90,.28)}
#tL,#tR,#horn{display:none}
#tL.vis,#tR.vis,#horn.vis{display:flex}
.tb{width:var(--ts,64px);height:var(--ts,64px);color:#3a8cff}
#tL,#tR{right:auto;bottom:39px}
#tL{left:13px}
#tR{left:calc(13px + var(--ts,64px) + 20px)}
#horn{right:auto;left:13px;bottom:calc(39px + var(--ts,64px) + 12px);color:#ff3b2e}
.tb.hold{--face:#0c1c3a}#horn.hold{--face:#35100d}
.dp{width:40px;height:40px;padding:0;border-radius:50%;background:rgba(10,16,8,.62);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.dp:hover,.dp:focus{background:rgba(10,16,8,.62)}.dp:active{background:rgba(60,90,40,.8);transform:none}
#posCopy{display:none;position:absolute;right:6px;top:6px;z-index:6;height:24px;padding:0 8px;border-radius:7px;background:rgba(10,16,8,.78);border:1px solid rgba(255,255,255,.45);align-items:center;justify-content:center}
#posCopy.on{display:flex}
#hud.on{display:flex}
#fsBtn,#fuelBtn,#volBtn,#exBtn,#sndBtn{display:none!important}
#score{position:absolute;right:6px;top:100px;display:none;pointer-events:none;z-index:5;padding:5px 7px;border-radius:7px;background:rgba(10,16,8,.62);border:1px solid rgba(255,255,255,.3);opacity:.85;box-sizing:content-box}
.pop{position:absolute;left:50%;top:33%;pointer-events:none;z-index:6;animation:gbPop 1.5s ease-out forwards}
@keyframes gbPop{0%{transform:translate(-50%,0) scale(.5);opacity:0}12%{transform:translate(-50%,-2px) scale(1.3);opacity:1}26%{transform:translate(-50%,-4px) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-12px) scale(1);opacity:0}}
.ctl.cfgOn{outline:2px dashed rgba(255,255,255,.55);outline-offset:5px}.ctl.cfgSel{outline:3px dashed #ffd23a;outline-offset:6px}
#menuBtn{top:6px;left:auto;right:6px}#menuMain{top:38px;width:230px;left:auto;right:6px}
#hud{position:absolute;right:6px;top:150px;display:none;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none;font:600 12px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#d8ff8a;text-shadow:0 1px 2px #000,0 0 3px #000}
#scene{display:block;background:#2f5a1e;touch-action:manipulation}
.panel{padding:10px 12px 24px;display:flex;flex-direction:column;gap:9px;max-width:980px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:#22301f;color:var(--ink);border:1px solid #38512f;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
button:hover{background:#2c3f27}
button:active{transform:translateY(1px)}
button.pri{background:var(--acc);color:#16210a;border-color:var(--acc);font-weight:700}
.speed{display:flex;align-items:center;gap:10px;flex:1 1 260px}
.speed input{flex:1;accent-color:var(--acc);min-width:120px}
output{min-width:34px;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
#msg{color:var(--acc);font-size:13px}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
summary{cursor:pointer;color:var(--mut)}
textarea{width:100%;margin-top:8px;background:#0c120b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.hint{color:var(--mut);font-size:12px}
.pre{display:flex;flex-wrap:wrap;gap:6px}.pre button{flex:1 1 30%;padding:9px 6px;text-align:center}.pre button.on{background:#3b5a2c;border-color:#8bc46a;color:#fff}
</style>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;background:#000;z-index:99999"></div>
<div id="wrap"><canvas id="scene"></canvas><div id="rpmBar"><div id="rpmFill"></div></div><canvas id="rpmTxt" aria-label="RPM"></canvas><div id="wrBar"><div id="wrFill"></div></div><canvas id="wrTxt" aria-label="Wear rate"></canvas><button id="startBtn" class="ctl" aria-label="Engine start"><canvas class="lbl" id="stLbl"></canvas></button><button id="brk" class="ctl" aria-label="Brake"><canvas class="glf" data-ch="B" data-col="#ff3b2e"></canvas></button><button id="thr" class="ctl" aria-label="Accelerator"><canvas class="glf" data-ch="A" data-col="#27d652"></canvas></button><button id="exBtn" class="sb" aria-label="Exhaust menu"><canvas class="lbl"></canvas></button><button id="sndBtn" class="sb" aria-label="Sound menu"><canvas class="lbl"></canvas></button><button id="volBtn" class="sb" aria-label="Volume menu"><canvas class="lbl"></canvas></button><button id="menuBtn" class="sb" aria-label="Menu"><canvas class="lbl"></canvas></button><div id="menuEx" class="mnu"></div><div id="menuSnd" class="mnu"></div><div id="menuVol" class="mnu"></div><div id="menuMain" class="mnu"></div><button id="fuelBtn" title="Reset fuel (testing)" aria-label="Reset fuel">⛽</button><button id="fsBtn" title="Full screen on / off" aria-label="Full screen">⛶</button><canvas id="speedo" width="220" height="160" aria-label="Speedometer"></canvas><div id="hud"><canvas id="fps"></canvas><canvas id="rms"></canvas><canvas id="life"></canvas></div></div>
<div class="panel">
  <div class="pre" id="presets"></div>
  <div class="hint" id="presetNote"></div>
  <div class="row">
    <label class="speed">Biome change <input type="range" id="biome" min="0" max="100" value="100"><output id="biomeO" style="min-width:92px">100</output></label>
    <button id="bBiome">🗺️ Biomes</button>
  </div>
  <div class="hint" id="biomeNow"></div>
  <div class="row">
    <label class="speed">Bridge chance <input type="range" id="bridges" min="0" max="100" value="100"><output id="bridgesO" style="min-width:44px">100%</output></label>
    <button id="bBridges">🌉 Bridges</button>
    <label class="speed">River twist <input type="range" id="twist" min="1" max="3" step="0.01" value="2.12"><output id="twistO" style="min-width:44px">2.12×</output></label>
  </div>
  <div class="row">
    <label class="speed">Wall chance <input type="range" id="walls" min="0" max="100" value="40"><output id="wallsO" style="min-width:44px">40%</output></label>
    <button id="bWalls">🧱 Walls</button>
    <button id="bSides">↔ Sides: independent</button>
  </div>
  <div class="row">
    <button id="bTrees">🌳 Trees</button>
    <button id="bRoad">🛣️ Road texture</button>
    <button id="bGrass">🌱 Grass</button>
    <button id="bHedge">🌿 Hedge</button>
    <button id="bBush">🌼 Bushes</button>
    <button id="bAll">🎲 Everything</button>
  </div>
  <div class="row">
    <button class="pri" id="bCopy">📋 Copy settings</button>
    <span id="msg"></span>
  </div>
  <details id="det"><summary>Settings text (copy it manually if the button can't)</summary>
    <textarea id="out" rows="16" readonly spellcheck="false"></textarea>
  </details>
  <div class="hint">Keys: <b>space</b> pause · <b>T</b> trees · <b>R</b> road · <b>G</b> grass · <b>H</b> hedge · <b>B</b> bushes · <b>M</b> biomes · <b>W</b> walls · <b>V</b> bridges · <b>A</b> everything</div>
</div>

<script>
// ===== GB350 procedural audio, built from native Web Audio nodes only (no per-sample JS, so it can't underrun or click) =====
// Engine note follows the Grand Rally 63 recipe: a detuned stereo pair of sawtooth oscillators whose pitch glides with the revs.
// Everything is automated with setTargetAtTime / short attack ramps, so no AudioParam is ever snapped.
class GBAudio{
  constructor(ctx){
    const c=this.c=ctx,sr=c.sampleRate;
    this.p={rpm:0,load:.18,spd:0,gear:1,fire:0,crank:0,lim:0,sput:-1,surfG:0,surfD:0,bridge:0};
    this.mask=0x3ff;this.ex=0;this.seed=0x1234567;this.lastT=0;this.cyc=0;this.brAcc=0;this.popT=0;this.sputT=0;this.lastLoad=.18;this.limPh=0;
    this.out=c.createGain();this.out.gain.value=.8;
    const cp=this.comp=c.createDynamicsCompressor();cp.threshold.value=-16;cp.knee.value=14;cp.ratio.value=5;cp.attack.value=.012;cp.release.value=.28;
    const sc=this.soft=c.createWaveShaper();{const n=2048,cv=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;cv[i]=Math.tanh(x*1.15)/Math.tanh(1.15)*.96;}sc.curve=cv;}
    const fin=this.fin=c.createGain();fin.gain.value=1;this.out.connect(cp);cp.connect(sc);sc.connect(fin);fin.connect(c.destination);
    this.bikeBus=c.createGain();this.bikeBus.gain.value=1;this.bikeBus.connect(this.out);
    this.musicBus=c.createGain();this.musicBus.gain.value=.315;{const mc=c.createDynamicsCompressor();mc.threshold.value=-12;mc.knee.value=10;mc.ratio.value=4;mc.attack.value=.01;mc.release.value=.2;this.musicBus.connect(mc);mc.connect(fin);}
    this.L=[];for(let i=0;i<10;i++){const g=c.createGain();g.gain.value=1;g.connect(this.bikeBus);this.L.push(g);}   // 0 engine, 1 intake, 2 wind, 3 tyres, 4 bridge, 5 pops, 6 clunk, 7 starter, 8 wall echo L, 9 wall echo R
    this.white=this.mkNoise(2.0,0);this.brown=this.mkNoise(3.0,1);this.gravel=this.mkNoise(3.0,2);
    this.buildEngine();this.buildIntake();this.buildWind();this.buildTyres();this.buildBridge();this.buildStarter();this.buildEchoes();
    this.XL=1.446;this.XR=1.562;this.setExhaust(0,true);this.setMask(this.mask);
  }
  rnd(){let s=this.seed;s^=s<<13;s^=s>>>17;s^=s<<5;this.seed=s|0;return (s>>>0)/4294967296;}
  // ---- pre-rendered looping noise (made once; crossfaded so the loop seam is silent) ----
  mkNoise(sec,kind){
    const c=this.c,n=Math.round(sec*c.sampleRate),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let x=0,env=0;
    for(let i=0;i<n;i++){
      const w=Math.random()*2-1;
      if(kind===0)d[i]=w;
      else if(kind===1){x=(x+.02*w)/1.02;d[i]=x*3.4;}
      else{x=(x+.04*w)/1.04;if(Math.random()<.004)env=.6+Math.random()*.9;env*=.9935;d[i]=x*1.6+w*env*.55;}
    }
    const f=Math.round(.12*c.sampleRate);                       // seam crossfade
    for(let i=0;i<f;i++){const a=i/f;d[i]=d[i]*a+d[n-f+i]*(1-a);}
    return this.trim(b,n-f);
  }
  trim(b,len){const c=this.c,o=c.createBuffer(1,len,c.sampleRate);o.getChannelData(0).set(b.getChannelData(0).subarray(0,len));return o;}
  src(buf){const s=this.c.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,Math.random()*1.0);return s;}
  bq(type,f,Q,g){const b=this.c.createBiquadFilter();b.type=type;b.frequency.value=f;if(Q!=null)b.Q.value=Q;if(g!=null)b.gain.value=g;return b;}
  gn(v){const g=this.c.createGain();g.gain.value=v;return g;}
  // ---- engine: two detuned saws (L/R) + a half-speed sub saw, shaped by the exhaust, lumped at the firing rate ----
  buildEngine(){
    const c=this.c;
    const mk=(t,det)=>{const o=c.createOscillator();o.type=t;o.frequency.value=20;o.detune.value=det;o.start();return o;};
    this.oA=mk('sawtooth',0);this.oB=mk('sawtooth',0);this.oS=mk('sawtooth',0);
    const pA=c.createStereoPanner(),pB=c.createStereoPanner();pA.pan.value=-.65;pB.pan.value=.65;
    this.gA=this.gn(.5);this.gB=this.gn(.5);this.gS=this.gn(.42);
    this.oA.connect(this.gA).connect(pA);this.oB.connect(this.gB).connect(pB);this.oS.connect(this.gS);
    const dn=this.src(this.white),dg0=this.gn(2e-5);dn.connect(dg0);this.mix=this.gn(1);dg0.connect(this.mix);pA.connect(this.mix);pB.connect(this.mix);this.gS.connect(this.mix);
    this.preLP=this.bq('lowpass',4000,.5);this.shaper=c.createWaveShaper();this.shaper.oversample='2x';
    this.lp1=this.bq('lowpass',300,.7);this.lp2=this.bq('lowpass',300,.7);
    this.pk1=this.bq('peaking',60,2,6);this.pk2=this.bq('peaking',110,2,3);
    this.hp=this.bq('highpass',24,.7);
    this.lump=this.gn(.78);this.eg=this.gn(0);
    this.mix.connect(this.preLP);this.preLP.connect(this.shaper);this.shaper.connect(this.lp1);this.lp1.connect(this.lp2);this.lp2.connect(this.pk1);this.pk1.connect(this.pk2);this.pk2.connect(this.hp);this.hp.connect(this.lump);
    this.raspBP=this.bq('bandpass',500,.7);this.raspG=this.gn(0);this.shaper.connect(this.raspBP);this.raspBP.connect(this.raspG);this.raspG.connect(this.lump);   // mid-range rasp: the part of the exhaust note a phone speaker can actually play
    this.lump.connect(this.eg);this.eg.connect(this.L[0]);
    // firing-rate lump (single cylinder: one big thump every two revolutions) and slow organic pitch wander
    this.lfo=c.createOscillator();this.lfo.frequency.value=10;this.lfo.start();const lg=this.gn(.22);this.lfo.connect(lg);lg.connect(this.lump.gain);
    const w1=c.createOscillator(),w2=c.createOscillator();w1.frequency.value=.37;w2.frequency.value=.23;w1.start();w2.start();
    const wg1=this.gn(0),wg2=this.gn(0);w1.connect(wg1);w2.connect(wg2);wg1.connect(this.oA.detune);wg2.connect(this.oB.detune);
  }
  buildIntake(){const s=this.src(this.white),b=this.bq('bandpass',400,.8);this.intakeBP=b;this.ig=this.gn(0);s.connect(b);b.connect(this.ig);this.ig.connect(this.L[1]);}
  buildWind(){const s=this.src(this.brown),f=this.bq('lowpass',400,.5);this.windLP=f;this.wg=this.gn(0);s.connect(f);f.connect(this.wg);this.wg.connect(this.L[2]);}
  buildTyres(){
    const t=this.src(this.brown),tl=this.bq('lowpass',420,.6);this.tgT=this.gn(0);t.connect(tl);tl.connect(this.tgT);this.tgT.connect(this.L[3]);
    const g=this.src(this.gravel),gl=this.bq('lowpass',1000,.6),gh=this.bq('highpass',90,.5);this.tgG=this.gn(0);g.connect(gl);gl.connect(gh);gh.connect(this.tgG);this.tgG.connect(this.L[3]);
    const d=this.src(this.brown),dl=this.bq('lowpass',210,.6);this.tgD=this.gn(0);d.connect(dl);dl.connect(this.tgD);this.tgD.connect(this.L[3]);
  }
  buildBridge(){const s=this.src(this.brown),f=this.bq('lowpass',230,.6);this.brg=this.gn(0);s.connect(f);f.connect(this.brg);this.brg.connect(this.L[4]);}
  buildStarter(){
    // low growly grind, not a tone: dark noise chopped by a fast motor "buzz", surging once per compression (whir... whir... whir)
    const c=this.c,n=this.src(this.brown),bp=this.bq('bandpass',150,.9),lp=this.bq('lowpass',360,.7);
    this.stBuz=this.gn(.45);this.stMod=this.gn(.3);this.stG=this.gn(0);
    n.connect(bp);bp.connect(lp);lp.connect(this.stBuz);this.stBuz.connect(this.stMod);this.stMod.connect(this.stG);this.stG.connect(this.L[7]);
    this.stR=c.createOscillator();this.stR.frequency.value=30;this.stR.start();const bg=this.gn(.4);this.stR.connect(bg);bg.connect(this.stBuz.gain);   // motor growl
    this.stL=c.createOscillator();this.stL.frequency.value=2;this.stL.start();const dg=this.gn(.7);this.stL.connect(dg);dg.connect(this.stMod.gain);       // compression surge
  }
  // ---- wall echoes: the muffler note bounced off a wall on one side, panned 65% that way, faded in/out over ~250 ms ----
  mkImpulse(sec,seed){
    const c=this.c,sr=c.sampleRate,n=Math.round(sec*sr),b=c.createBuffer(1,n,sr),d=b.getChannelData(0);let lp=0,x=seed|0||1;
    for(let i=0;i<n;i++){x^=x<<13;x^=x>>>17;x^=x<<5;const w=((x>>>0)/4294967296)*2-1;lp+=(w-lp)*.28;d[i]=lp*Math.exp(-i/(sr*.15))*(i<sr*.004?i/(sr*.004):1);}
    for(const [ms,a] of [[19,.9],[33,.6],[52,.45]]){const k=Math.round(ms/1000*sr);if(k<n)d[k]+=a*(seed%2?1:-1);}   // a few close wall reflections
    // level the impulse where the engine lives (40-400 Hz) so both sides echo at the same strength whatever the random tail does
    let acc=0,cnt=0;for(let f=40;f<=600;f*=1.07){const w=2*Math.PI*f/sr;let re=0,im=0;for(let i=0;i<n;i++){re+=d[i]*Math.cos(w*i);im+=d[i]*Math.sin(w*i);}acc+=Math.hypot(re,im);cnt++;}
    const g=1/Math.max(1e-6,acc/cnt);for(let i=0;i<n;i++)d[i]*=g;
    return b;
  }
  buildEchoes(){
    // a second, slightly higher-pitched copy of the muffler note (about +2 semitones), delayed and reverberated, one per side

  g.fillStyle=style==='brick'?hsla(10,46,34,1):hsla(34,9,40,1);g.fillRect(1,1,pw,pw);
  g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=1.2;g.strokeRect(1.5,1.5,pw-1,pw-1);

  g.fillStyle='rgba(255,244,210,.26)';g.beginPath();g.moveTo(x0,x0);g.lineTo(x0,x1);g.lineTo(x1,x1);g.closePath();g.fill();
  g.fillStyle='rgba(0,0,0,.16)';g.beginPath();g.moveTo(x0,x0);g.lineTo(x1,x0);g.lineTo(x1,x1);g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=1;g.strokeRect(x0+.5,x0+.5,x1-x0-1,x1-x0-1);

// ================= rivers + bridges =================
// Every BR px of road is a "slot"; a slot holds a bridge with probability bridgeShare. The bridge type is weighted by the road surface under it
// (wood likes dirt, stone likes gravel/tarmac, truss likes tarmac) but every type can appear on every surface.
const BR=3000,BW={wood:[1,6,3],stone:[4,2,4],truss:[6,1,2]};      // weights for [tarmac, dirt, gravel]
const bridgeSlots=new Map(),bridgeZones=[];
let bridgeShare=1,twistK=2.12,riverF=[.5,2],roadMix=null,treeMul=1,preset=null,nowMs=0;
const STEELS=[
  {dark:'hsl(215,18%,11%)',mid:'hsl(213,14%,38%)',hi:'hsl(210,20%,64%)',name:'grey-blue steel'},
  {dark:'hsl(150,24%,9%)',mid:'hsl(150,24%,25%)',hi:'hsl(148,28%,48%)',name:'green painted steel'},
  {dark:'hsl(10,44%,10%)',mid:'hsl(12,48%,31%)',hi:'hsl(14,58%,52%)',name:'rusty red steel'}
];
function slotFor(j){
  let s=bridgeSlots.get(j);if(s)return s;
  const sd=state.seeds.bridges,h=n=>ihash(j,200+n,sd);
  s={j,on:h(0)<bridgeShare,pc:j*BR+BR*(.2+.6*h(1)),ready:false,gen:null};
  if(s.on){
    const bankW=Math.round(24*u),bankM=Math.round(6*u),f=Math.exp(Math.log(riverF[0])+Math.log(riverF[1]/riverF[0])*h(2)),W=Math.round(Math.min(150*u*f,ch*.8)),t=clamp((2-W/(150*u))/1.5,0,1);
    const swingMax=Math.max(0,ch*.9-W*1.6-2*(bankM+bankW)-16),swing=Math.min((twistK-1)*1.5*W*lerp(.4,1,t),swingMax),A=swing/2;   // 1 = dead straight, 3 = swings 3x the water width; scaled by width (creeks twist most)
    const A1=A*.72*(.85+.3*h(8)),A2=A*.28*(.8+.4*h(9)),l1=Math.max(lerp(560,170,t)*(.85+.3*h(10)),4.4*A1),l2=Math.max(lerp(220,75,t)*(.85+.3*h(11)),4.4*A2),l3=180+h(12)*160,p1=h(13)*TAU,p2=h(14)*TAU,p3=h(15)*TAU;
    const r=((ch-s.pc)%HS+HS)%HS,sf=road?roadAt(s.pc).surf(r):{m:.5,g:0};
    const wt=w=>w[0]*(1-sf.m)*(1-sf.g)+w[1]*sf.m*(1-sf.g)+w[2]*sf.g;
    const ws={wood:wt(BW.wood),stone:wt(BW.stone),truss:wt(BW.truss)},q=h(3)*(ws.wood+ws.stone+ws.truss);
    s.type=q<ws.wood?'wood':(q<ws.wood+ws.stone?'stone':'truss');
    s.surf=sf.g>.5?'gravel':sf.m>.5?'dirt':'tarmac';
    Object.assign(s,{W,bankW,bankM,A1,A2,l1,l2,l3,p1,p2,p3,twist:t,swing,Lb:Math.round(W*1.08+2*(bankM+Math.round(bankW*.5))+8),seed:Math.floor(h(4)*1e9),dir:h(5)<.5?-1:1,steel:STEELS[(h(6)*STEELS.length)|0]});
    riverShape(s);
    s.zh=s.ext+bankM+bankW*.75+6;
  }
  bridgeSlots.set(j,s);return s;
}
function riverShape(s){        // pure geometry: river runs straight under the road, then meanders more and more towards the edges
  const W=s.W,cx=cw/2,r0=roadW/2+6*u,r1=r0+Math.max(40*u,(cw-roadW)/2*.45);
  const env=x=>smooth(r0,r1,Math.abs(x-cx));
  const dy=x=>env(x)*(s.A1*Math.sin(x/s.l1*TAU+s.p1)+s.A2*Math.sin(x/s.l2*TAU+s.p2));
  const hwf=x=>{const sl=(dy(x+1.5)-dy(x-1.5))/3;return W/2*(1+.07*Math.sin(x/s.l3*TAU+s.p3))*Math.min(2.2,Math.sqrt(1+sl*sl));};   // constant width across the current, not up the screen
  let ext=0;for(let x=0;x<=cw+6;x+=6)ext=Math.max(ext,Math.abs(dy(x))+hwf(x));
  s.dy=dy;s.hwf=hwf;s.ext=ext;s.Hc=Math.ceil(2*(ext+s.bankM+s.bankW)+12);s.mid=s.Hc/2;s.yc=x=>s.mid+dy(x);
}
const zoneHit=(z,p,x,m)=>Math.abs(p-(z.pc-z.dy(x)))<z.hwf(x)+z.bankM+z.bankW*.5+m;
function inZone(p,x,m){for(const z of bridgeZones){if(p<z.pc-z.zh-m||p>z.pc+z.zh+m)continue;if(zoneHit(z,p,x,m)||zoneHit(z,p,x-m,m)||zoneHit(z,p,x+m,m))return true;}return false;}
function subtractZones(runs,x){
  for(const z of bridgeZones){
    const c=z.pc-z.dy(x),hh=z.hwf(x)+z.bankM+z.bankW*.5+8,za=c-hh,zb=c+hh;
    for(let i=runs.length-1;i>=0;i--){
      const r=runs[i];if(r.b<=za||r.a>=zb)continue;
      const parts=[];if(r.a<za)parts.push({a:r.a,b:za,style:r.style});if(r.b>zb)parts.push({a:zb,b:r.b,style:r.style});
      runs.splice(i,1,...parts);
    }
  }
}
function genBridges(){bridgeSlots.clear();bridgeZones.length=0;clearChunks();}
function computeBridges(si,lo,hi){
  bridgeZones.length=0;
  for(let j=Math.floor(lo/BR)-1;j<=Math.floor(hi/BR)+1;j++){
    const s=slotFor(j);
    if(!s.on||s.pc+s.zh<lo||s.pc-s.zh>hi)continue;
    bridgeZones.push(s);
    if(!s.gen){s.gen=bridgeGen(s);warmQ.unshift(()=>s.gen);}
  }
  if(bridgeSlots.size>14)for(const[k,s]of[...bridgeSlots])if(s.pc<si-5000)bridgeSlots.delete(k);
}
function bridgesAhead(){       // slider change: re-decide only slots that are still completely off-screen
  const lim=Math.floor(scroll)+ch+Math.round(450*u);
  for(const[k,s]of[...bridgeSlots])if(s.pc-(s.zh||0)>lim)bridgeSlots.delete(k);
  invalidateAhead();
}

// ---- river (static bank + water art, plus two light ripple layers that scroll sideways)
function tracePath(t,s){
  for(let x=0;x<=cw+6;x+=8){const y=s.yc(x)-s.hwf(x);if(x)t.lineTo(x,y);else t.moveTo(x,y);}
  for(let x=cw+6;x>=0;x-=8)t.lineTo(x,s.yc(x)+s.hwf(x));
  t.closePath();
}
function makeRip(s,seedOff,dens,al){
  const rng=mulberry32(s.seed+seedOff),c=mk(cw,s.Hc),g=c.getContext('2d'),n=Math.round(cw*s.W/900*dens);
  g.lineCap='round';
  for(let i=0;i<n;i++){
    const x=rng()*cw,hf=s.hwf(x),y=s.yc(x)+(rng()-.5)*hf*1.7,len=(8+rng()*22)*u,bend=(rng()-.5)*3*u;
    const sl=(s.yc(x+3)-s.yc(x-3))/6,th=Math.atan(sl),co=Math.cos(th),si=Math.sin(th);   // ripples lie along the current
    g.strokeStyle=hsla(s.H+2,55,72+rng()*12,al*(.6+rng()*.6));g.lineWidth=(1+rng()*.9)*Math.max(.8,u);
    for(const dx of[-cw,0,cw]){g.beginPath();g.moveTo(x+dx-co*len/2,y-si*len/2);g.quadraticCurveTo(x+dx-si*(bend+1),y-co*(bend+1),x+dx+co*len/2,y+si*len/2+bend*.4);g.stroke();}
  }
  return c;
}
function* riverGen(s){
  const W=s.W,bm=s.bankM,bk=s.bankW,rng=mulberry32(s.seed),Wd=cw;
  const H=198+rng()*16,Hc=s.Hc;
  s.H=H;
  const yc=s.yc,hwf=s.hwf,c=mk(Wd,Hc),g=c.getContext('2d');
  const ir=x=>bm*(.8+.6*vnP(x/28,3.3,s.seed&0xffff,0,0));
  const poly=(off,fill)=>{
    g.beginPath();
    for(let x=0;x<=Wd+6;x+=6){const y=yc(x)-hwf(x)-off(x);if(x)g.lineTo(x,y);else g.moveTo(x,y);}
    for(let x=Wd+6;x>=0;x-=6)g.lineTo(x,yc(x)+hwf(x)+off(x));
    g.closePath();g.fillStyle=fill;g.fill();
  };
  poly(x=>ir(x)+2,hsla(36,26,28,1));            // mud
  poly(x=>ir(x)*.5,hsla(40,30,46,1));           // wet sand rim
  for(let x=-4;x<Wd+6;x+=3)for(const side of[-1,1]){   // grass fringe
    const y=yc(x)+side*(hwf(x)+bm+rng()*bk*.45),r=2.5+rng()*5.5;
    g.fillStyle=hsla(90+rng()*12,36+rng()*12,24+rng()*14,.97);blob(g,x,y,r,rng,8);
    if(rng()<.5){g.fillStyle=hsla(96+rng()*10,44,38+rng()*8,.9);blob(g,x-r*.2,y+r*.2,r*.55,rng,7);}
  }
  yield;
  const E=hsla(H-10,40,52,1),M1=hsla(H-3,50,41,1),D=hsla(H+6,62,25,1);     // water: light shallows, dark middle
  for(let x=0;x<Wd;x+=2){
    const y0=yc(x)-hwf(x)+.5,h2=2*hwf(x)-1,gr=g.createLinearGradient(0,y0,0,y0+h2);
    gr.addColorStop(0,E);gr.addColorStop(.2,M1);gr.addColorStop(.5,D);gr.addColorStop(.8,M1);gr.addColorStop(1,E);
    g.fillStyle=gr;g.fillRect(x,y0,3,h2);
  }
  g.save();g.beginPath();tracePath(g,s);g.clip();          // soft current streaks, kept inside the water
  for(let i=0;i<48;i++){
    const x=rng()*Wd,y=yc(x)+(rng()-.5)*hwf(x)*1.8,rx=(30+rng()*70)*u,ry=(2+rng()*4)*u,lite=rng()<.5;
    g.fillStyle=lite?hsla(H+4,60,66,.07):hsla(H+10,60,14,.10);
    for(const dx of[-Wd,0,Wd]){g.beginPath();g.ellipse(x+dx,y,rx,ry,0,0,TAU);g.fill();}
  }
  g.restore();
  yield;
  const rocks=Math.round((6+((rng()*8)|0))*2.5);
  for(let i=0;i<rocks;i++){
    const x=rng()*Wd,side=rng()<.5?-1:1,inWater=rng()<.55,r=(5+rng()*8)*u;
    const y=yc(x)+side*hwf(x)*(inWater?.5+rng()*.5:1.02+rng()*.25);
    if(inWater){g.strokeStyle=hsla(H-6,40,88,.4);g.lineWidth=1.4;g.beginPath();g.ellipse(x,y,r*1.35,r*1.05,0,0,TAU);g.stroke();}
    g.fillStyle='rgba(8,20,12,.30)';blob(g,x+r*.4,y-r*.4,r*1.05,rng,9);
    g.fillStyle=hsla(30,6,40,1);blob(g,x,y,r,rng,9);
    g.fillStyle=hsla(32,8,56,1);blob(g,x-r*.2,y+r*.2,r*.62,rng,8);
    g.fillStyle=hsla(36,10,70,.8);blob(g,x-r*.35,y+r*.35,r*.28,rng,7);
  }
  g.lineCap='round';
  const reeds=Math.round((18+((rng()*14)|0))*2.5);
  for(let i=0;i<reeds;i++){                             // reed clumps on the banks and in the shallows (top-down: little bursts of blades)
    const x=rng()*Wd,side=rng()<.5?-1:1,y=yc(x)+side*(hwf(x)+bm*(rng()*1.4-.25)),nb=6+((rng()*5)|0);
    for(let k=0;k<nb;k++){
      const a=rng()*TAU,len=(4+rng()*6)*u,ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;
      g.strokeStyle=hsla(76+rng()*10,36,30+rng()*8,1);g.lineWidth=1.3;g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.stroke();
      g.strokeStyle=hsla(66,46,52,.9);g.lineWidth=1;g.beginPath();g.moveTo(x+Math.cos(a)*len*.7,y+Math.sin(a)*len*.7);g.lineTo(ex,ey);g.stroke();
    }
    if(rng()<.5){g.fillStyle=hsla(28,40,26,1);g.beginPath();g.ellipse(x+(rng()-.5)*3,y-3*u,1.4,3.2*u,0,0,TAU);g.fill();}
  }
  for(let i=0;i<46;i++){                                // grass tufts on the outer bank
    const x=rng()*Wd,side=rng()<.5?-1:1,y=yc(x)+side*(hwf(x)+bm+rng()*bk*.5);
    g.strokeStyle=hsla(88+rng()*14,46,34+rng()*14,.9);g.lineWidth=1.1;g.beginPath();
    for(let k=0;k<4;k++){const a=-Math.PI/2+(rng()-.5)*1.4,len=3+rng()*4;g.moveTo(x,y);g.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);}
    g.stroke();
  }
  s.river=c;
  yield;
  s.rip1=makeRip(s,1,1.3,.5);yield;s.rip2=makeRip(s,2,1,.4);yield;s.rip3=makeRip(s,3,1.2,.32);
  s.path=typeof Path2D==='function'?new Path2D():null;if(s.path)tracePath(s.path,s);
}

// ---- bridge decks (drawn under the foliage) and truss tops (drawn over it)
function woodDeck(g,s,ox,oy){
  const rng=mulberry32(s.seed+11),dw=s.deckW,L=s.Lb,ph=Math.max(5,Math.round(6*u+1));
  g.fillStyle='hsl(25,30%,10%)';g.fillRect(ox,oy,dw,L);
  const gaps=[];let lastGap=-9,row=-1;
  for(let y=0;y<L;y+=ph){
    row++;let x=0;const h=Math.min(ph,L-y)-1;
    if(y>ph*2&&y<L-ph*3&&row>lastGap+1&&rng()<.07){gaps.push([y,h]);lastGap=row;}   // an occasional missing plank, never two in a row
    while(x<dw){
      const seg=rng()<.55?dw-x:Math.min(dw-x,(120+rng()*200)*u),w=seg-1;
      g.fillStyle=hsla(25+rng()*10,34+rng()*12,32+rng()*16,1);g.fillRect(ox+x,oy+y,w,h);
      g.fillStyle='rgba(255,230,180,.18)';g.fillRect(ox+x,oy+y+h-1,w,1);g.fillRect(ox+x,oy+y,1,h);
      g.fillStyle='rgba(0,0,0,.2)';g.fillRect(ox+x,oy+y,w,1);
      for(let k=0;k<2;k++){const gx=ox+x+rng()*w*.7,gy=oy+y+1+rng()*(h-2);g.fillStyle='rgba(0,0,0,.13)';g.fillRect(gx,gy,rng()*w*.3+8,1);}
      if(rng()<.1){g.fillStyle='rgba(30,16,6,.5)';g.beginPath();g.ellipse(ox+x+rng()*w,oy+y+h/2,2.4,1.4,0,0,TAU);g.fill();}
      g.fillStyle='rgba(20,12,6,.75)';g.fillRect(ox+x+3,oy+y+h/2,1.6,1.6);g.fillRect(ox+x+w-5,oy+y+h/2,1.6,1.6);
      x+=seg;
    }
  }
  const rw0=Math.max(7,Math.round(8*u));
  for(const[gy,gh]of gaps){                                                               // knock the plank out so the water shows through
    g.clearRect(ox+rw0+1,oy+gy,dw-2*rw0-2,gh+1);
    g.fillStyle='rgba(15,8,3,.55)';g.fillRect(ox+rw0+1,oy+gy,dw-2*rw0-2,1.5);
  }
  g.fillStyle='hsl(26,36%,18%)';g.fillRect(ox,oy,dw,3);g.fillRect(ox,oy+L-3,dw,3);        // bearer beams at the two ends
  const rw=Math.max(7,Math.round(8*u)),sp=Math.round(34*u+8),so=Math.round(5*u+2),ps=Math.round(rw*1.7);
  const rails=[ox+1,ox+dw-1-rw];
  g.fillStyle='rgba(8,20,10,.30)';                                                       // rail shadows, low so a short offset
  for(const rx of rails){g.fillRect(rx+so*.8,oy-so*.8,rw,L);for(let y=0;y<=L;y+=sp)g.fillRect(rx+rw/2-ps/2+so*.8,oy+y-ps/2-so*.8,ps,ps);}
  for(const rx of rails){
    g.fillStyle='hsl(28,30%,16%)';g.fillRect(rx-1,oy-1,rw+2,L+2);
    g.fillStyle='hsl(30,38%,46%)';g.fillRect(rx,oy,rw,L);
    g.fillStyle='rgba(255,236,190,.25)';g.fillRect(rx,oy,1.2,L);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(rx+rw-1.2,oy,1.2,L);
    for(let y=0;y<=L;y+=sp){
      const px=rx+rw/2-ps/2,py=oy+y-ps/2;
      g.fillStyle='hsl(28,30%,16%)';g.fillRect(px-1,py-1,ps+2,ps+2);g.fillStyle='hsl(28,34%,34%)';g.fillRect(px,py,ps,ps);
      g.fillStyle='hsl(31,40%,54%)';g.fillRect(px+1.5,py+1.5,ps-3,ps-3);
    }
  }
}
function stoneDeck(g,s,ox,oy){

    const rh=Math.min((15+rng()*11)*u,L-y);let x=0;
    while(x<dw){
      const sw=Math.min((38+rng()*70)*u,dw-x),hh=30+rng()*12,ss=4+rng()*8,ll=48+rng()*16;
      const gr=g.createLinearGradient(ox+x,oy+y+rh,ox+x+sw,oy+y);gr.addColorStop(0,hsla(hh,ss,ll+6,1));gr.addColorStop(1,hsla(hh,ss,ll-6,1));
      g.fillStyle=gr;rr(g,ox+x+.8,oy+y+.8,sw-1.6,rh-1.6,2.2);g.fill();g.strokeStyle='rgba(0,0,0,.42)';g.lineWidth=1;g.stroke();

  par(ox);par(ox+dw-W_.ww-1);

function steelDeck(g,s,ox,oy){

function trussDraw(g,s,ox,oy,flat){
  const dw=s.deckW,L=s.Lb,cwid=Math.max(10,Math.round(11*u)),pl=Math.round(38*u+14),n=Math.max(2,Math.round(L/pl)),pitch=L/n;
  const sh=Math.max(6,Math.round(6.5*u)),bw=Math.max(5,Math.round(5.2*u)),lx=ox+1,rx=ox+dw-1-cwid,col=s.steel;

function scatterRange(kind,p0,p1,out){

  const b0=Math.floor((p0-maxD)/BAND),b1=Math.floor((p1+maxD)/BAND);
  for(let b=b0;b<=b1;b++)for(let side=0;side<2;side++){
    const outer=side?cw-hedgeOR:hedgeOL;
    const e=g.dens*g.max*(g.dk==='td'?treeMul:1)*Math.max(outer+avg*.3,avg*.5)*BAND/(avg*avg);
    let n=Math.floor(e);if(ihash(b,side+50,seed)<e-n)n++;
    for(let i=0;i<n;i++){
      const k=b*64+i,h=f=>ihash(k,side*16+f,seed);
      const p=b*BAND+h(4)*BAND;

      if(h(7)*g.max>=B[g.dk])continue;                    // thinning = biome density

function stepChunk(c,ops){

    hedgeRange(p0-100,topP+100,items);scatterRange('bushes',p0,topP,items);scatterRange('trees',p0,topP,items);
    items.sort((a,b)=>a.z-b.z||b.p-a.p);

         [213,85],[210,100],[205,113],[199,122],[190,128],[162,133],[132,139],[104,147],[80,153]];

    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;

function housing(x,y){

    const ax=P[i][0],ay=P[i][1],ex=P[i+1][0]-ax,ey=P[i+1][1]-ay;

    if(bike.tank>=TANK_MILES){bike.tank=TANK_MILES;bike.out=true;if(bike.eng===2)bike.eng=0;}   // dry tank: the engine splutters and dies

    const sput=bike.out&&bike.eng===0&&bike.outT>=0&&bike.outT<3.2;

    }

    if(++hudN%12===0){const tx=biomeNowText();if(tx!==hudTxt){hudTxt=tx;$('biomeNow').textContent=tx;}}
  }catch(e){$('msg').textContent='Draw error: '+e.message;console.error(e);return;}
  requestAnimationFrame(tick);

function cname(h,s,l){
  h=((h%360)+360)%360;
  if(s<12)return l<20?'near-black':l<30?'dark grey':l<42?'mid grey':'light grey';
  if(s<18&&h>=20&&h<70)return l<35?'dark grey-brown':'grey-beige';
  if(h<15||h>=345)return l<35?'dark red':'red';
  if(h<42)return l<30?'dark brown':l<48?'brown':'tan';
  if(h<70)return l<30?'dark olive':'yellow-green';
  if(h<165)return l<24?'very dark green':l<32?'dark green':l<42?'green':'bright green';
  if(h<260)return l<30?'dark blue-grey':'blue-grey';
  return 'purple';
}

// ================= rider + bike on the road (set up by the picker screens) =================
// Saved start position. dx = % of road width right of the screen centre, dy = % of road width up from the bottom of the canvas, h = bike height as % of road width
const START_POS={dx:0,dy:139,h:55};
// the bike and rider are drawn 10% bigger, but the rear edge of the bike stays exactly where it was, so the extra size grows upward only
const BIKE_SCALE=1.1;
function bikeH(){return START_POS.h/100*roadW*BIKE_SCALE;}
function bikeCY(){return ch-START_POS.dy/100*roadW+30-(BIKE_SCALE-1)/2*START_POS.h/100*roadW;}
const MAX_LEAN=9*Math.PI/180;            // the bike only pivots about 5 degrees either way
const LAT_SPEED=.7274;                     // sideways, in road widths per second at full steer
const player={active:false,bike:null,rider:null,steer:0,off:0,x:0,y:0,ang:0,hb:{w:0,h:0}};
const steerIn={l:false,r:false};
function bikeSize(H){try{return BikePicker.sizeOf(player.bike,H);}catch(e){return{w:H*.5,h:H};}}
// invisible barriers: the inner face of the hedge on each side, or of a wall where one runs alongside. The hit box is the sprite 5 px smaller all round, so a mirror tip never counts.
function steerStep(dt){
  if(!player.active)return;
  const tgt=(steerIn.r?1:0)-(steerIn.l?1:0);
  player.steer+=(tgt-player.steer)*(1-Math.exp(-dt/.16));                 // eases in and out
  if(Math.abs(player.steer)<.002&&!tgt)player.steer=0;
  const f=.25+.75*Math.min(1,bike.v/20);                                  // a bike can't slide sideways when it isn't moving
  player.off+=player.steer*f*LAT_SPEED*(1-CFG.steerHalf*pen.tyres)*dt;
  const H=bikeH(),sz=bikeSize(H),y=bikeCY();
  const hbW=Math.max(4,sz.w-10),hbH=Math.max(4,sz.h-10),ang=player.steer*f*MAX_LEAN;
  const half=hbW/2*Math.cos(ang)+hbH/2*Math.abs(Math.sin(ang));
  let x=cw/2+(START_POS.dx/100+player.off)*roadW;
  const si=curS,pTop=si+ch-(y-hbH/2),pBot=si+ch-(y+hbH/2),ww=(walls&&walls.ww)||0;
  let xl=roadL-vw,xr=roadR+vw;
  for(const r of wallRuns[0])if(r.b>=pBot&&r.a<=pTop)xl=Math.max(xl,hedgeOL+hw/2+ww/2);
  for(const r of wallRuns[1])if(r.b>=pBot&&r.a<=pTop)xr=Math.min(xr,hedgeOR-hw/2-ww/2);
  let hit=false;
  if(x-half<xl){x=xl+half;hit=true;}else if(x+half>xr){x=xr-half;hit=true;}
  if(hit){player.off=(x-cw/2)/roadW-START_POS.dx/100;player.steer=0;bike.wall=.35;}
  wobPh+=dt;const sp=Math.min(1,bike.v/30);      // worn suspension rocks the bike side to side, worn tyres add a slow weave; it never counts as a wall hit
  const wob=roadW*sp*(CFG.wobSusp*pen.susp*(Math.sin(wobPh*10.7)+.5*Math.sin(wobPh*20.7+1))/1.5+CFG.wobTyre*pen.tyres*Math.sin(wobPh*6.9+2));
  x=Math.max(xl+half,Math.min(xr-half,x+wob));
  player.x=x;player.y=y;player.ang=ang+(wob/Math.max(1,roadW))*1.2;player.hb.w=hbW;player.hb.h=hbH;
}
// engine pulse: the bike kicks 4% on each power stroke (one per two crank turns, rpm/120), the rider kicks 6% over 60% of that period and shakes sideways a few px at the crank rate (rpm/60).
// above ~18 Hz a 60 fps screen can't show every beat, so the movement fades down rather than strobing.
function pulseEnv(p,len){return p<len?Math.pow(1-p/len,2):0;}
function pulseAmp(f){return f<=18?1:Math.max(.25,1-(f-18)/22*.75);}
let pulseT=0;
function drawPlayer(){
  if(!window.BikePicker)return;
  const x=player.x||cw/2,y=player.y||bikeCY(),H=bikeH();
  const now=performance.now();let dt=pulseT?Math.min(.05,(now-pulseT)/1000):0;pulseT=now;if(paused)dt=0;
  const rpm=bike.rpm,on=rpm>100,f1=rpm/240,f2=rpm/120;      // both run at half the engine's real rate so the movement can be seen at speed
  player.p1=((player.p1||0)+(on?f1*dt:0))%1;player.p2=((player.p2||0)+(on?f2*dt:0))%1;
  const bA=on?.04*pulseAmp(f1)*pulseEnv(player.p1,1):0,rA=on?.06*pulseAmp(f1)*pulseEnv(player.p1,.6):0,wig=on?Math.sin(player.p2*6.2832)*.011*roadW*pulseAmp(f2):0;

/* shared pixel-font labels: every word on the picker screens is drawn with the game's own canvas font */
function lab(txt, k, col, shadow) {
  var F = GBFont, d = Math.max(1, Math.min(2, window.devicePixelRatio || 1)), c = document.createElement('canvas');
  var w = Math.ceil(Array.from(txt).reduce(function (a, ch) { return a + F.fontAdv(ch, k, k); }, 0) + k), h = Math.ceil(5 * k + k);
  c.width = Math.round(w * d); c.height = Math.round(h * d); c.style.cssText = 'display:block;pointer-events:none;width:' + w + 'px;height:' + h + 'px;';
  var x = c.getContext('2d');
  function put(cl, o) { return function (X, Y, W, H) { var a = Math.round((X + o) * d), b = Math.round((Y + o) * d); x.fillStyle = cl; x.fillRect(a, b, Math.round((X + o + W) * d) - a, Math.round((Y + o + H) * d) - b); }; }
  if (shadow) F.fontDraw(put('#000', k * .75), txt, 0, 0, k, k);
  F.fontDraw(put(col || '#d42020', 0), txt, 0, 0, k, k);
  return c;
}
// pill-button label that always fits: drawn at size k0, then shrunk if it would fill more than ~64% of the button width
function fitLab(btn, txt, k0) {
  btn.appendChild(lab(txt, k0));
  var units = Array.from(txt).reduce(function (a, ch) { return a + GBFont.fontAdv(ch, 1, 1); }, 0) + 1;
  function f() {
    var w = btn.clientWidth; if (!w) return;
    var k = Math.max(1, Math.min(k0, Math.floor(w * 0.64 / units * 4) / 4));
    btn.textContent = ''; btn.appendChild(lab(txt, k));
  }
  requestAnimationFrame(function () { requestAnimationFrame(f); });
  window.addEventListener('resize', f);
}
function setLab(b, txt) { b.textContent = ''; b.appendChild(lab(txt, 3)); }


/* Bimble Boys - Bike Picker (garage style)  -  v1.4 (riders added)
 *
 * Sheets: BS001.png to BS004.png in the same folder as this file.
 * Each sheet is a grid of COLS x ROWS bikes (6 x 2). Cell size is worked out
 * from the loaded image, so any sheet resolution works. Each bike is drawn
 * straight from its grid cell - no individual files.
 *
 * Usage:
 *   BikePicker.open({ onSelect: (bike) => { ... } });
 *   bike = { index, sheet, col, row }   // index is 0..47 across all sheets
 *
 * Draw the chosen bike in-game with:
 *   BikePicker.drawBike(ctx, bike, x, y, height)
 */
(function () {
  // ---- Config ---------------------------------------------------------
  var SHEET_FILES = ['BS001.png', 'BS002.png', 'BS003.png', 'BS004.png'];
  // Your Bimble-Boys GitHub folder, built the same way as the car game's githubAsset()
  // (raw.githubusercontent.com address + encodeURIComponent(filename)). The picker tries
  // the page's own folder first, then this. (A page opened from a phone's downloads,
  // a content:// address, can't see sibling files, so the GitHub copy is what works there.)
  var GITHUB_ASSET_BASE = 'https://raw.githubusercontent.com/sprocket2cog/Bimble-Boys/refs/heads/main/';
  // The live GitHub Pages address of the same folder - the version a published page serves.
  // Tried first after the page's own folder (needs Pages switched on for the repo).
  var GITHUB_PAGES_BASE = 'https://sprocket2cog.github.io/Bimble-Boys/';
  // Exact-commit copies of files (a commit address never goes stale, so it works even when the
  // branch address is serving an old "not found"). Used as a last resort for these files.
  var GITHUB_PINNED = {
    'RS001.png': 'https://raw.githubusercontent.com/sprocket2cog/Bimble-Boys/beca882130f4b3db87ef1e6f01f56c79d0f8254a/RS001.png',
    'RS002.png': 'https://raw.githubusercontent.com/sprocket2cog/Bimble-Boys/beca882130f4b3db87ef1e6f01f56c79d0f8254a/RS002.png'
  };
  var COLS = 6, ROWS = 2;
  var BOX_WIDTH_VW = 95;        // box is 95% of screen width
  var BOX_HEIGHT_VH = 60;       // box height as % of screen height
  var BOX_BG = 'linear-gradient(to top, #2a2a2a, #7a7a7a)'; // charcoal at bottom -> mid grey at top
  var BOX_BORDER = '#d42020';   // red
  var BTN_BG = '#d42020';       // red buttons
  var BTN_SHADOW = '#8f1212';   // darker red edge
  var BTN_TEXT = '#ffffff';
  var PAGE_BG = '#000000';      // black backdrop behind the box
  var BOX_RADIUS = 24;          // px
  var SLIDE_SPEED = 0.18;       // 0..1, higher = snappier slide

  // Fallback colours (one per slot) used when a sheet is missing or broken.
  var FALLBACK_COLORS = [
    '#9a9a9a', '#1e1e1e', '#d42020', '#1f5fbf', '#f0b800', '#8b1a2b',
    '#1ea0b0', '#1f5a32', '#a68a64', '#b5b5b5', '#f2f2f2', '#2c2c2c'
  ];
  var FALLBACK_ASPECT = 0.5;    // placeholder width / height (matches 1:2 cells)

  var cells = [];
  var loading = null;
  var failedSheets = [];        // full URLs of sheets that could not be loaded

  // ---- Loading --------------------------------------------------------
  // Loads one sheet: beside the page first (several name variants), then the GitHub folder.
  // Never rejects - resolves with the image, or null if it can't be found.
  function loadImage(file, failedList, tag) {
    return new Promise(function (resolve) {
      var done = false;
      function finish(img) {
        if (done) return;
        done = true;
        if (!img) {
          var url = GITHUB_ASSET_BASE + encodeURIComponent(file);
          failedList.push(url);
          console.warn(tag + ': could not load ' + file + ' locally or at ' + url + ' - using placeholders');
        }
        resolve(img);
      }
      var base = file.replace(/\.[^.]+$/, '');
      var names = [file, base + '.PNG', base.toLowerCase() + '.png',
                   base + ' .png', base + ' .PNG',                  // a stray space before the extension
                   base + '.jpg', base + '.jpeg', base + '.webp'];
      // Order: exact name beside the page, exact name on GitHub, the same again with a cache-busting
      // tag (GitHub and browsers can remember a "not found" for a few minutes after a file is
      // renamed or uploaded), then the odd name variants.
      var ghExact = GITHUB_ASSET_BASE + encodeURIComponent(file);
      var pgExact = GITHUB_PAGES_BASE + encodeURIComponent(file);
      var candidates = [file, pgExact, pgExact + '?cb=' + Date.now(), ghExact, ghExact + '?cb=' + Date.now()];
      if (GITHUB_PINNED[file]) candidates.push(GITHUB_PINNED[file]);
      names.slice(1).forEach(function (n) { candidates.push(n); });
      names.slice(1).forEach(function (n) { candidates.push(GITHUB_PAGES_BASE + encodeURIComponent(n)); });
      names.slice(1).forEach(function (n) { candidates.push(GITHUB_ASSET_BASE + encodeURIComponent(n)); });
      function attempt(i) {
        if (i >= candidates.length) { finish(null); return; }
        try {
          var img = new Image();
          img.onload = function () {
            if (img.naturalWidth > 0 && img.naturalHeight > 0) finish(img);
            else attempt(i + 1);
          };
          img.onerror = function () { attempt(i + 1); };
          if (/^https?:/i.test(candidates[i])) img.crossOrigin = 'anonymous';
          img.src = candidates[i];
        } catch (e) { attempt(i + 1); }
      }
      attempt(0);
      setTimeout(function () { finish(null); }, 25000);
    });
  }

  // Never rejects: a missing/broken sheet becomes placeholder cells so the
  // picker (and the game) keeps running.
  function loadSheets() {
    if (loading) return loading;
    loading = Promise.all(SHEET_FILES.map(function (file, s) {
      return loadImage(file, failedSheets, 'BikePicker').then(function (img) { return { img: img, sheet: s }; });
    })).then(function (results) {
      results.forEach(function (r) {
        var img = r.img;
        var grid = img ? analyzeSheet(img) : null;   // [row][col] of cut rectangles
        for (var row = 0; row < ROWS; row++) {
          for (var col = 0; col < COLS; col++) {
            var g = grid ? grid[row][col] : { sx: 0, sy: 0, sw: 0, sh: 0, cx: 0, cy: 0, bh: 1 };
            cells.push({
              index: cells.length, sheet: r.sheet, col: col, row: row, img: img,
              sx: g.sx, sy: g.sy, sw: g.sw, sh: g.sh,   // source rectangle holding ONE bike, cut at the gaps
              cx: g.cx, cy: g.cy, bh: g.bh, bw: g.bw       // that bike's own centre + height inside the sheet
            });
          }
        }
      });
    });
    return loading;
  }

  // ---- Sheet slicing ---------------------------------------------------
  // The bikes on a sheet are NOT on an exact equal grid (the artwork drifts a few
  // pixels, and mirrors/exhausts stick out), so cutting at width/6 slices bikes in
  // half and lets neighbours bleed in. Instead each sheet is scanned for the empty
  // gaps between bikes and cut down the middle of those gaps, so every cell holds
  // exactly one whole bike. If the scan can't find 6 x 2 bikes (or the browser won't
  // let the page read the image's pixels), it falls back to the old equal grid.
  // <detectGrid>
  // Valley cutting: the sheet is *roughly* a COLS x ROWS grid, so each cut is placed
  // at the emptiest spot (fewest bike pixels) near where the equal-grid line would be.
  // Works even when a mirror or shadow of one bike touches the next one.
  function valleyCut(density, expected, reach) {
    var n = density.length;
    var lo = Math.max(1, Math.round(expected - reach)), hi = Math.min(n - 2, Math.round(expected + reach));
    var sm = [], i, j;
    for (i = lo; i <= hi; i++) {                      // light smoothing so single specks don't win
      var s = 0, k = 0;
      for (j = i - 2; j <= i + 2; j++) if (j >= 0 && j < n) { s += density[j]; k++; }
      sm.push(s / k);
    }
    var min = Infinity;
    for (i = 0; i < sm.length; i++) if (sm[i] < min) min = sm[i];
    var first = -1, last = -1, bestA = -1, bestB = -1, bestScore = Infinity;
    // among positions within a hair of the minimum, take the run closest to the expected line
    for (i = 0; i < sm.length; i++) {
      if (sm[i] <= min + 0.75) {
        var a = i; while (i + 1 < sm.length && sm[i + 1] <= min + 0.75) i++;
        var mid = lo + (a + i) / 2, score = Math.abs(mid - expected) - (i - a) * 0.5;
        if (score < bestScore) { bestScore = score; bestA = lo + a; bestB = lo + i; }
      }
    }
    return Math.round((bestA + bestB) / 2);
  }
  // Some rows hold one more (or fewer) sprite than the others, so optionally count the real
  // gaps in this row: a gap is a stretch where far fewer pixels than usual are drawn.
  // Returns the cut positions [0, ..., w], or null to use the normal equal-grid valleys.
  function autoColCuts(density, w, expected, enabled) {
    if (!enabled) return null;
    var n = density.length, i, sm = [];
    for (i = 0; i < n; i++) {
      var s = 0, k = 0;
      for (var j = i - 2; j <= i + 2; j++) if (j >= 0 && j < n) { s += density[j]; k++; }
      sm.push(s / k);
    }
    var nz = sm.filter(function (v) { return v > 0; }).sort(function (a, b) { return a - b; });
    if (!nz.length) return null;
    var thr = nz[Math.floor(nz.length * 0.75)] * 0.3;
    var cuts = [0], start = -1;
    for (i = 0; i <= n; i++) {
      var low = i < n && sm[i] < thr;
      if (low && start < 0) start = i;
      if (!low && start >= 0) {
        var a = start, b = i - 1; start = -1;
        if (a > w * 0.02 && b < w * 0.98) cuts.push(valleyCut(density, (a + b) / 2, (b - a) / 2 + 1));
      }
    }
    cuts.push(w);
    var count = cuts.length - 1;
    if (count < expected - 1 || count > expected + 2) return null;   // doesn't look right - use the plain grid
    return cuts;
  }
  // rgba = Uint8ClampedArray of the whole sheet. Returns grid[row][col]; never null.
  function detectGrid(rgba, w, h, cols, rows, reach, autoCols) {
    reach = reach || 0.35;                              // how far (x cell width) a cut may drift from its equal-grid line
    var br = rgba[0], bg = rgba[1], bb = rgba[2], ba = rgba[3];
    var transparentBg = ba < 16;
    var TOL = 28;
    function isContent(p) {
      var a = rgba[p + 3];
      if (a < 16) return false;
      if (transparentBg) return true;
      return Math.max(Math.abs(rgba[p] - br), Math.abs(rgba[p + 1] - bg), Math.abs(rgba[p + 2] - bb)) > TOL;
    }
    var x, y, r, c;
    // horizontal cut lines between bike rows
    var rowDen = new Array(h);
    for (y = 0; y < h; y++) { var n = 0; for (x = 0; x < w; x++) if (isContent((y * w + x) * 4)) n++; rowDen[y] = n; }
    var rowCuts = [0];
    for (r = 1; r < rows; r++) rowCuts.push(valleyCut(rowDen, h * r / rows, h / rows * 0.3));
    rowCuts.push(h);
    var grid = [];
    for (r = 0; r < rows; r++) {
      var top = rowCuts[r], bot = rowCuts[r + 1];
      var colDen = new Array(w);

  function pickRider(bike) {

  }
  // the workshop shows after the bike is chosen, unless it was already visited since the last level (straight after a finished run it comes first)
  var garageSeen = false;
  function pickBike() {

      if (garageSeen) pickRider(bike); else { garageSeen = true; openGarage(function () { pickRider(bike); }); }
    } });
  }
  function loadImg(urls) {
    return new Promise(function (res) {
      var i = 0, done = false;
      var to = setTimeout(function () { if (!done) { done = true; res(null); } }, 8000);
      function fin(v) { if (!done) { done = true; clearTimeout(to); res(v); } }

      })();
    });
  }
  var RAW = 'https://raw.githubusercontent.com/sprocket2cog/Bimble-Boys/';
  var introP = loadImg(['intro.jpg', RAW + '88410c68cca2498022d84fd30793cbae6527923e/intro.jpg']);
  var titleP = loadImg(['title.png', RAW + 'main/title.png']);
  var introImg = null, titleImg = null;
  // intro screen: the background fades up from black over 2 s, 1.5 s later the title grows from 1% to full width over 2 s, then START RIDING pulses under it. A tap goes full screen, fades everything to black over 1 s and opens the garage.
  var st = document.createElement('style');
  st.textContent = '@keyframes gbBlink{0%,55%{opacity:1}56%,100%{opacity:0}}@keyframes gbPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.5}}';
  document.head.appendChild(st);
  function showStart() {
    var o = el('div', { position: 'fixed', inset: '0', background: '#000', zIndex: 10005, overflow: 'hidden', userSelect: 'none', webkitUserSelect: 'none', touchAction: 'manipulation' });
    var bg = el('div', { position: 'absolute', inset: '0', opacity: '0', transition: 'opacity 2s linear', backgroundSize: 'cover', backgroundPosition: 'center', backgroundRepeat: 'no-repeat' });
    if (introImg) bg.style.backgroundImage = 'url("' + introImg.src + '")';
    var col = el('div', { position: 'absolute', inset: '0', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '3vmin', transition: 'opacity 1s linear', pointerEvents: 'none' });
    var tw = el('div', { width: '100%', opacity: '0', transform: 'scale(.01)', transformOrigin: '50% 50%', transition: 'opacity 2s linear, transform 2s ease-out' });
    var tEl;

    else tEl = null;
    var go = el('div', { visibility: 'hidden', cursor: 'pointer', pointerEvents: 'auto' });
    var t, ready = false;
    function fit() {                                   // START RIDING is two thirds of the screen width
      var txt = 'START RIDING';
      var units = Array.from(txt).reduce(function (a, ch) { return a + GBFont.fontAdv(ch, 1, 1); }, 0) + 1;
      var k = Math.max(1, Math.floor((document.documentElement.clientWidth * 0.667 / units) * 4) / 4);

      go.appendChild(t);
      if (!titleImg) { if (tEl) tEl.remove(); var kt = Math.max(1, Math.floor((document.documentElement.clientWidth * 0.9 / (Array.from('THE BIMBLE BOYS').reduce(function (a, ch) { return a + GBFont.fontAdv(ch, 1, 1); }, 0) + 1)) * 4) / 4); tEl = lab('THE BIMBLE BOYS', kt, '#ffd23a', true); tw.appendChild(tEl); tEl.style.margin = '0 auto'; }
    }
    if (tEl) tw.appendChild(tEl);
    var shine = null;
    if (titleImg) { tw.style.position = 'relative'; shine = document.createElement('canvas'); shine.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none'; tw.appendChild(shine); }
    var shineOn = false;
    // light sweep: a soft white 45-degree bar crosses the title (clipped to its opaque pixels) in 1.5 s, rests 1.5 s, and repeats
    function startShine() {

      var t0 = performance.now(), d = Math.max(1, Math.min(2, window.devicePixelRatio || 1)), sx = shine.getContext('2d'), cleared = true;
      (function frame(now) {
        if (!shineOn || !o.isConnected) return;
        var W = shine.clientWidth, H = shine.clientHeight;
        if (shine.width !== Math.round(W * d) || shine.height !== Math.round(H * d)) { shine.width = Math.round(W * d); shine.height = Math.round(H * d); cleared = false; }

        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.62)'); g.addColorStop(1, 'rgba(255,255,255,0)');

    o.appendChild(bg); o.appendChild(col);
