<!doctype html>
<!-- BIMBLE OWNER'S MANUAL LAB  |  design lab for the in-game handbook  |  pixel font copied from the game -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Owner's Manual Lab</title>
<style>
:root{--bg:#10140f;--line:#2a3a26;--ink:#e8f0de;--mut:#93a889}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:0}
#stage{position:relative;perspective:1400px;user-select:none}
#book{position:relative;background:#000}
#book canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.flip{transform-origin:left center;backface-visibility:hidden;transition:transform .5s cubic-bezier(.45,.05,.3,1)}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 60%);opacity:0;transition:opacity .5s}
#bar{display:flex;gap:8px;align-items:center;justify-content:center}
#bar button{background:#1a2417;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;min-width:64px}
#bar button:active{background:#2a3a26}
#pn{min-width:70px;text-align:center;color:var(--mut);font-size:14px}
</style></head><body>
<div id="app"><div id="stage"><div id="book"></div></div>
</div>
<script type="text/plain" id="content">
# BIMBLE OWNER'S MANUAL - EDITABLE TEXT
# Lines starting with # are notes and are ignored.
#
# @SECTION name    starts a new section (it appears in the index, page numbers are automatic)
# @PAGE title      new page inside the same section
# @INSERT title    extra page that is not in the index
#
# p text    paragraph
# h text    small red heading
# l text    bullet point (several in a row make one list)
# w text    warning box. Start it with DANGER: WARNING: CAUTION: or NOTICE: for the colour
# t a | b   table row (several in a row make one table, the first row is the header)
# d name    diagram. Names: signals parts dash revs gears torque wear fuel sprockets
# g         small gap
# x text    big centred red line (used for sign-offs)
# n         page of notes lines
#
# Use only: letters numbers . , ! ? : - / & ' ( ) " % + < >
# Each page must fit. A red ! in the top corner of a page means it is too long.

@SECTION WELCOME
p Congratulations on buying a 350cc motorcycle of no practical use.
p Your Bimble makes you part of a worldwide family of owners who appreciate going slowly in a straight line.
h To ensure your riding pleasure:
l Read this manual. Or just look at the pictures.
l Follow the procedures. Most are optional.
l Heed the safety messages. Several are real.
w NOTICE: The bike pictured may not match your bike. Your bike is better.
@PAGE ABOUT THIS MANUAL
p This manual covers the Bimble 350, sold in every country that has a road, a shed, or both.
h Destination codes
t CODE | DESTINATION
t UK | BRITAIN. WET.
t AU | AUSTRALIA. A BIT DRY.
t SHED | WHERE THE BIKE LIVES
t FLAT | ANYWHERE... FLAT!
p Specifications may vary. The bimbling does not.
w CAUTION: This manual contains no tips on stunts. There are no wheelies.

@SECTION SAFETY FIRST
p Your safety is very important. Operating this bike safely is an important responsibility.
d signals
p It is not practical to warn you about every hazard. Use your own good judgement. Good luck.
@PAGE OTHER WARNINGS
w DANGER: You WILL be bimbled if you do not follow these instructions.
w WARNING: This is not a real motorcycle. Do not attempt to ride a mobile device.
w CAUTION: Do not play this game while riding, near water or riding near water.
w NOTICE: Sausage rolls may be hot. cider is not a protection.

@SECTION KNOW YOUR BIKE
p Your bike has one cylinder, five gears, and no nannies.
d parts
p The engine is air cooled. The fins are not decoration. (Mostly).
@PAGE THE ENGINE
p The 348cc single cylinder fires once every two turns. You will hear every one.
p The long stroke makes torque low down, so the bike pulls from walking pace without complaint. (Mostly)
l Air cooled: (how quaint)
l Compression ratio 9.5 to 1
l Five speed gearbox, chain drive
w NOTICE: A cold engine should be warmed up. A warm engine should be left alone...
@INSERT INSIDE THE ENGINE
d piston-section carb piston-small
p A piston, a carburettor and some sort of opinion. Three of those are real parts.
@INSERT ALL THE ANGLES
p The same bike from the front, the top and the back. It is the same bike. It goes the same way.
d bike-front bike-top bike-rear
@INSERT THE OTHER SIDE
d bike-side-l
p This is the side. It is the same as the other side. But backwards
w WARNING: The other side is only the other side because you're standing on this one.

@SECTION INSTRUMENTS
d dash
h Display check
p When the ignition is on, the needle sweeps to the maximum once. If it does not, the bike is not on.
w NOTICE: A shop tachometer may also sweeps. This is not a fault. It is showing off.
@PAGE READING THE REVS
d revs
p The bike changes gear by itself. It shifts up at 5900 rpm, down below 2400, and hits the limiter at 6100.
l Green is where you want to be
l Orange is where you are thinking about it
l Red is the redline. It is not a suggestion!
w WARNING: Holding the throttle on the limiter will not make you faster. Only louder.

@SECTION STARTING THE ENGINE
l Sit on the bike. This helps.
l Press START.
l Wait for the starter to crank.
l The engine catches and settles to idle at about 1000 rpm.
l Pull away gently. (You don't have a choice.)
g
p A single cylinder thumps at idle. This is normal. This is the point.
w NOTICE: If the engine will not start, you may be out of fuel. Or luck or tea.
@INSERT IF IT WILL NOT START
l Check the fuel.
l Check the fuel again.
l Check the shop for a service manual.
l Give up and have a cider.
g
p The cider does not fix the bike. It stops you throwing spanners.
g
d cider tea
p Pick one. Or both. We will not tell.

@SECTION RIDING
h Controls
l Throttle: makes the bike go
l Brake: makes the bike stop
l Steering: point the bike where you want it to go
g
p Gears are changed for you. Please do not feel bad about this.
w WARNING: The bike goes where you steer it, not where you meant to steer it.
@PAGE SURFACES
t SURFACE | WHAT TO EXPECT
t TARMAC | GRIP, PEACE, JOY
t GRAVEL | LOUD, LOOSE, SLIGHTLY RUDE
t DIRT | BRAVE
t BRIDGE DECK | A DIFFERENT NOISE
t WALLS | JUST NO...
g
p The bike sounds different on every surface. This is not a fault. It is science!
w CAUTION: Walls are solid. They have always been.

@SECTION GEARS & POWER
d gears
p Engine rpm against road speed in each gear.
l Blue is the stock bike
l Red is your bike right now
@PAGE TORQUE
d torque
p Blue is the stock engine. Red is your engine right now. A louder exhaust, a tune or a sprocket change ETC moves the red line. The blue line never moves. The blue line is a realist, The red line is Jackson Pollick 
@PAGE THE AUTOMATIC GEARBOX
t GEAR | MPH PER 1000 RPM (STOCK)
t 1ST | 4.7
t 2ND | 7.3
t 3RD | 10.2
t 4TH | 13.0
t 5TH | 15.8
g
p Ratios are the real GB350 ones: 3.071, 1.947, 1.407, 1.100 and 0.900. Primary drive 2.095. Final drive 2.500.
w NOTICE: Stock 0-62 mph takes about 12 seconds. Stock top speed is 80 mph.
@INSERT INSIDE THE GEARBOX
d gearbox crank
p Five speeds, selected for you. The rider is not consulted.
d clutch chain-arm
p Parts you will never touch. They work quietly and resentfully.

@SECTION PICKING THINGS UP
p Items appear on the road. Ride into them. This is the whole game and nothing but the game.
p Points are also earned for speed. But Speed also wears out your bike faster. (Do the maths.)
h How to pick things up
l Locate the thing.
l Ride into the thing.
l Feel pleased.
@INSERT THINGS TO PICK UP
d sausage brick
p Sausage roll: warm, flaky, edible. Brick: not edible, useful in emergencies.
@INSERT A WORD ON MONEY
p Your wallet fills as you ride. Spend it in the shop.
t ITEM | NOTE
t EXHAUSTS | LOUDER
t PERFORMANCE MODS| DIGNITY
t RIDER GEAR | LEATHER, ALLEGEDLY
t SERVICE MANUALS | READING OPTIONAL
g
w CAUTION: Spending more than you have is not possible. We checked. (Twice)

@SECTION WEAR & REPAIRS
d wear
p The bars show health. Left is worn. Right is new.
l Everything wears with use
l Every gear change wears the engine a little
@PAGE SERVICE MANUALS
p There are 16 service manuals. Each one cuts your repair bills. Reading them is optional. Owning them is smart.
p A worn engine loses power. A worn rider loses patience.
w WARNING: Do not attempt repairs with a brick. The brick is for emergencies.
w NOTICE: A repaired bike is not a new bike. It is a bike with a history.
@INSERT PARTS THAT WEAR
d caliper tyre shock
d drum wheel
p All of these wear. All of them will tell you about it at the worst possible moment.

@SECTION FUEL
d fuel
p One tank lasts 7.5 miles. Then the engine splutters and falls silent.
w WARNING: Running out of fuel is not covered by this manual. It is covered by regret.
@INSERT FUEL ECONOMY
p The fuel is fixed. The excuses are not.
p The real bike takes unleaded petrol, 91 or higher, and holds 15 litres. The game bike holds a story.
d fuel-system
w NOTICE: Do not fill the tank with anything you would not drink at a party.

@SECTION ACCESSORIES
p Exhausts change the sound and the top speed. A louder exhaust will not make you fast, but it will make you feel fast, which is nearly the same thing.
t EXHAUST | TOP SPEED
t STOCK | 80 MPH
t CONE | 84 MPH
t SHOTGUN | 86 MPH
t RACE CAN | 90 MPH
g
w CAUTION: Accessories may cause the owner to talk shit.
@PAGE SPROCKETS
d sprockets
p A bigger rear sprocket gives more pull and less top speed. A smaller one does the reverse. Fitting one does not make you a mechanic.
@PAGE TACHOMETERS
p Tachometers replace the rev bar on your screen. Fitting one adds no power. It adds nothing.
t TACHO | STYLE
t ROUND | CLASSIC, WITH NEEDLE
t DIGITAL | BAR GRAPH, LOUD COLOURS
t SPORT | DIGITAL, BUT ANGRY
g
p You can also design your own. It costs a lot of money and takes a certain kind of person.
@PAGE ENGINE MODS
p Performance upgrades will become available as you progress.
p Yes, They will cost a lot of money 
p Some will increase fuel economy, others will make it worse.
w CAUTION: Performance upgrades may cause the owner to talk more shit.
d piston-crank
@INSERT EXHAUST SYSTEMS
d exhaust
p A pipe. It goes bang at the back. That is its whole job.
@INSERT RIDER GEAR
d helmet-peak helmet
d boot glove
p Leather, allegedly. It protects the rider from the road. The road is not impressed.

@SECTION SPECIFICATIONS
t MAIN COMPONENTS | VALUE
t LENGTH | 2175 MM
t WIDTH | 790 MM
t HEIGHT | 1100 MM
t WHEELBASE | 1440 MM
t GROUND CLEARANCE | 170 MM
t CASTER ANGLE | 27.5 DEG
t TRAIL | 120 MM
t CURB WEIGHT | 178 KG
t MAX LOAD | 180 KG
t TURNING RADIUS | 2.30 M
@PAGE ENGINE DATA
t ENGINE | VALUE
t DISPLACEMENT | 348 CC
t BORE X STROKE | 70.0 X 90.5 MM
t COMPRESSION | 9.5 : 1
t FUEL | UNLEADED 91 RON OR HIGHER
t TANK | 15.0 L
t BATTERY | YTZ7S 12V 6AH
t IDLE SPEED | 1000 RPM aprox
t SPARK PLUG | MR6K-9 (NGK)
t PLUG GAP | A GNATS DICK
t ENGINE OIL | ON THE FLOOR 
@PAGE TRANSMISSION
t TRANSMISSION | VALUE
t 1ST GEAR | 3.071
t 2ND GEAR | 1.947
t 3RD GEAR | 1.407
t 4TH GEAR | 1.100
t 5TH GEAR | 0.900
t PRIMARY DRIVE | 2.095
t FINAL DRIVE | 2.500
t FRONT TYRE | 100/90-19
t REAR TYRE | 150/70 R17
t TYRE PRESSURE | 250 KPA (36 PSI)
@PAGE OTHER DATA
t OTHER | VALUE
t CHAIN | GOLD, 104 LINKS
t SPROCKETS | 14T / 35T
t CHAIN SLACK | 25 - 35 MM
t BRAKE FLUID | DOT 4
t OIL CAPACITY | 2.0 L
t BULBS | LED (IT'S THE FUTURE)
t SAUSAGE ROLLS | 7 (WARM)
t OPINIONS | TOO MANY 
t SATIRE LEVEL | HIGH
t GAME TANK | 7.5 MILES APROX

@SECTION TROUBLESHOOTING
t PROBLEM | FIX
t WON'T START | CHECK FUEL
t BIKE IS SLOW | VISIT THE SHOP
t BIKE IS VERY SLOW | YOU ARE BIMBLING. THIS IS CORRECT
t ENGINE IS LOUD | EXHAUST. INTENTIONAL
t CRASHED | SEE SAFETY FIRST
t NEEDLE JUMPS AT START | DISPLAY CHECK. NORMAL
t SOUNDS ODD ON DIRT | IT IS DIRT
@PAGE QUESTIONS
h Frequently asked
l Can I wheelie it? No.
l Can I fit a bigger engine? Please ask someone else.
l Why does it sound like that? It is pretending it's a tractor.
l Is it faster than a sausage roll? Depends how hot.
l Where is the clutch? Gone. Be calm & Carry On...
l Is this a real manual? It is as real as the bike.

@SECTION WARRANTY
p No warranty is given or implied. The bike is held together by spite and duct tape.
p Sausage rolls were included in good faith. No refunds on sausage rolls.
p If you find a fault, it is a feature. If you find a feature, it is a fault.
g
h Owner feedback
p Please send comments to the shack.
@INSERT HAPPY BIMBLING
d sheep
x Happy bimbling.

@SECTION NOTES
n</script>

function parse(txt){const pages=[],secs=[];let secName='',pg=null;
  const np=t=>{pg={h:t,b:[]};pages.push(pg);};
  for(const raw of txt.split(/\r?\n/)){const ln=raw.trim();if(!ln||ln[0]==='#')continue;let m;
    if((m=/^@SECTION\s+(.+)$/i.exec(ln))){secName=m[1].trim();np(secName);secs.push({n:secName,pg:pages.length+1});continue;}
    if((m=/^@PAGE\s*(.*)$/i.exec(ln))){np(m[1].trim()||secName);continue;}
    if((m=/^@INSERT\s*(.*)$/i.exec(ln))){np(m[1].trim()||'NOTICE');continue;}
    if(!pg)np('MANUAL');
    m=/^([pwlthdx])\s+(.*)$/.exec(ln);
    const k=m?m[1]:(/^[ng]$/.test(ln)?ln:'p'),v=m?m[2]:ln,b=pg.b,last=b[b.length-1];
    if(k==='l'){if(last&&last.li)last.li.push(v);else b.push({li:[v]});}
    else if(k==='t'){const c=v.split('|').map(s=>s.trim());if(last&&last.tbl)last.tbl.push(c);else b.push({tbl:[c]});}

  S.forEach((s,q)=>{const yy=y+q*17;R(g,X,yy,W,9,s[1]);T(g,s[0],X+3,yy+2,1,'#fff');T(g,s[2],X+1,yy+11,1,INK);});}
const WB={DANGER:['#c8202e','#fff'],WARNING:['#ff9f1a',INK],CAUTION:[YEL,INK],NOTICE:['#cfd6dd',INK]};

// ---- page renderer. Everything is laid out on a fixed page: nothing scrolls.
let overflow={};
function wrapB(x,sz,W){let ls=wrap(x,sz,W);if(ls.length>=2&&ls[ls.length-1].trim().split(/\s+/).length===1){for(let w2=W-3;w2>=W*.6;w2-=3){const l2=wrap(x,sz,w2);if(l2.length===ls.length&&l2[l2.length-1].trim().split(/\s+/).length>=2){ls=l2;break;}}}return ls;}
function wrapS(t,sz,W){const out=[];String(t).split(/(?<=[.!?])\s+(?=\S)/).forEach(x=>wrapB(x,sz,W).forEach(l=>out.push(l)));return out;}
function navBar(g,i,hits){const y=LH-15,h=12,bw=28,X=MX+2,W=LW-MX*2-2;
  const btn=(x,w,lab,pg)=>{R(g,x,y,w,h,INK);R(g,x+1,y+1,w-2,h-2,PAPER);const lw=strW(lab,1,1);T(g,lab,x+Math.round((w-lw)/2),y+4,1,INK);hits.push({x,y,w,h,pg});};
  btn(X,bw,'<',i-1);btn(Math.round((LW-bw*1.6)/2),Math.round(bw*1.6),'INDEX',1);btn(X+W-bw,bw,'>',i+1);}
function page(i){const P=PAGES[i];
  if(P.t==='cover')return {c:cover(),hits:[]};if(P.t==='back')return {c:backCover(),hi:backHi(),hits:[]};
  const [c,g]=mk();R(g,0,0,LW,LH,PAPER);
  for(let x=0;x<4;x++)R(g,x,0,1,LH,x===0?'#d8d2bd':x===1?'#e3ddc8':x===2?'#ebe6d2':'#efead8');
  const hits=[],later=[];let y=10;const W=LW-MX*2-2,X=MX+2;
  if(P.t==='index'){
    T(g,'CONTENTS',X,y,2,RED);y+=12;R(g,X,y,W,1,INK);y+=5;
    const n=SECTIONS.length,pitch=Math.max(7,Math.min(10,Math.floor((LH-34-y)/n)));
    SECTIONS.forEach((s,k)=>{const label=String(k+1)+'. '+s.n,num=String(s.pg),nw=strW(num,1,1);
      T(g,label,X,y,1,INK);T(g,num,X+W-nw,y,1,INK);
      const lw=strW(label,1,1);for(let x=X+lw+3;x<X+W-nw-3;x+=3)R(g,x,y+4,1,1,GREY);
      hits.push({x:X-2,y:y-1,w:W+4,h:pitch,pg:s.pg});y+=pitch;});
    if(y+14<LH-17){R(g,X,y+1,W,1,INK);T(g,'TAP A LINE TO JUMP THERE',X,y+6,1,GREY);}
    navBar(g,i,hits);return {c,hits};}
  T(g,'GB350(ISH)',X,1,1,GREY);
  {const wide=P.h.split(' ').every(w=>strW(w,2,1)<=W);
   if(wide){const ls=wrap(P.h,2,W,1);ls.forEach((l,q)=>T(g,l,X,y+q*12,2,RED));y+=ls.length*12;}else{T(g,P.h,X,y+1,1,RED);y+=11;}}
  R(g,X,y,W,1,INK);y+=6;
  const IMG=P.b.some(b=>b.d&&(SPRM[b.d[0]]||b.d[0]==='parts'||b.d[0]==='sprockets'));
  const AL=(ln,x0,w0,sz)=>IMG?x0+Math.round((w0-strW(ln,sz||1,1))/2):x0;
  const blk=[];let acc=y;
  for(const b of P.b){let o=null;
    if(b.p){const ls=wrapS(b.p,1,W);o={t:'p',h:ls.length*7+4,dr:yy=>ls.forEach((ln,q)=>T(g,ln,AL(ln,X,W),yy+q*7,1,INK))};}
    else if(b.xx){const ls=wrapS(b.xx,2,W);o={t:'p',h:ls.length*11+4,dr:yy=>ls.forEach((ln,q)=>T(g,ln,AL(ln,X,W,2),yy+q*11,2,RED))};}
    else if(b.hh){const ls=wrap(b.hh,1,W);o={t:'p',h:ls.length*7+2,dr:yy=>ls.forEach((ln,q)=>T(g,ln,AL(ln,X,W),yy+q*7,1,RED))};}
    else if(b.gap)o={t:'g',h:4,dr:()=>{}};
    else if(b.li){const items=b.li.map(it=>wrapS(it,1,W-8));let h=3;items.forEach(ls=>h+=ls.length*7+1);
      o={t:'l',h,dr:yy=>{let q=yy;items.forEach(ls=>{R(g,X,q+1,3,3,RED);ls.forEach(ln=>{T(g,ln,X+7,q,1,INK);q+=7;});q+=1;});}};}
    else if(b.w){const kind=((/^(DANGER|WARNING|CAUTION|NOTICE)/i.exec(b.w)||[])[1]||'CAUTION').toUpperCase(),col=WB[kind],ln=wrapS(b.w,1,W-20),h=Math.max(16,ln.length*7+8);
      o={t:'w',h:h+4,dr:yy=>{R(g,X-1,yy,W+2,h,INK);R(g,X,yy+1,W,h-2,col[0]);
        if(kind==='NOTICE'){R(g,X+4,yy+Math.round((h-9)/2),9,9,INK);T(g,'I',X+7,yy+Math.round((h-9)/2)+2,1,col[0]);}else warnIcon2(g,X+4,yy+Math.round((h-10)/2));
        ln.forEach((l,q)=>T(g,l,AL(l,X+19,W-22),yy+5+q*7,1,col[1]));}};}
    else if(b.tbl){const c1=Math.floor(W*.42);let h=3;const rows=b.tbl.map(row=>{const a=wrap(row[0]||'',1,c1-3),bb=wrap(row[1]||'',1,W-c1-3),n=Math.max(a.length,bb.length,1);h+=n*7+3+1;return {a,bb,n};});
      o={t:'t',h,dr:yy=>{let q=yy;b.tbl.forEach((row,ri)=>{const {a,bb,n}=rows[ri],hh=n*7+3;
        if(ri===0)R(g,X-1,q,W+2,hh,RED);else if(ri%2===0)R(g,X-1,q,W+2,hh,'#e6e0ca');
        a.forEach((l,k)=>T(g,l,X+1,q+2+k*7,1,ri===0?'#fff':INK));bb.forEach((l,k)=>T(g,l,X+c1+2,q+2+k*7,1,ri===0?'#fff':INK));
        R(g,X+c1-1,q,1,hh,ri===0?'#fff':'#c9c2aa');q+=hh;R(g,X-1,q,W+2,1,'#c9c2aa');q+=1;});}};}
    else if(b.notes){const y0=acc,cnt=Math.floor((LH-22-y0)/8);o={t:'n',h:cnt*8,dr:yy=>{for(let q=0;q<cnt;q++)R(g,X,yy+q*8+6,W,1,'#b9b29b');T(g,'SAUSAGE ROLL COUNT:',X,yy,1,INK);}};}
    else if(b.d){const nm=b.d[0];
      if(nm==='signals')o={t:'d',h:DIAG.signals+3,dr:yy=>signals(g,X,yy,W)};
      else if(SPRM[nm]){let k=1;const nat=b.d.map(n=>SPRM[n][0]).reduce((a,c)=>a+c,0)+SPR_GAP*(b.d.length-1);
        const cand=b.d.length===1&&nat*2<=W*HZ&&nm!=="sheep";const base=sprRowH(b.d);
        o={t:'s',h:base+3,cand,base,k:1,dr:yy=>later.push(['__spr',X*HZ,yy*HZ,W*HZ,o.base*o.k*HZ,b.d,o.k])};}
      else{const hh=DIAG[nm]||30;o={t:'s',h:hh+3,dr:yy=>later.push([nm,X*HZ,yy*HZ,W*HZ,hh*HZ])};}}

  }
  let total=blk.reduce((a,o)=>a+o.h,0);const y0=y;
  if(IMG)blk.forEach(o=>{if(o.cand&&(LH-17)-y0-total>=o.base+30){o.k=2;o.h=o.base*2+3;total+=o.base;}});
  const free=(LH-17)-y0-total,n=blk.length,gaps=new Array(n+1).fill(0);
  if(IMG&&free>0&&n){const wt=[1.2];for(let k=1;k<n;k++){const p=blk[k-1].t,c=blk[k].t;wt.push(p==='s'&&c==='p'?0:p==='p'&&c==='s'?1.6:p==='s'&&c==='s'?1.4:(p==='p'&&c==='p')?.3:(c==='w'||p==='l'||c==='l')?.5:1);}wt.push(1);
    const sum=wt.reduce((a,c)=>a+c,0);let used=0;for(let k=0;k<=n;k++){gaps[k]=Math.min(30,free*wt[k]/sum);used+=gaps[k];}
    const left=free-used;if(left>0){gaps[0]+=left/2;gaps[n]+=left/2;}}

  if(y>LH-17){overflow[i]=y;R(g,LW-13,2,10,9,'#d02030');T(g,'!',LW-9,4,1,'#fff');}

  return {c,hi:hi&&hi[0],hits};}
const cache={};function getPage(i){return cache[i]||(cache[i]=page(i));}

// ---- the book: one page on screen, flips with a 3D page turn
const book=document.getElementById('book');
let cur=0,busy=false,S=3;const UP=6;
function big(pg){const c=document.createElement('canvas');c.width=LW*UP;c.height=LH*UP;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(pg.c,0,0,LW*UP,LH*UP);if(pg.hi)g.drawImage(pg.hi,0,0,LW*UP,LH*UP);return c;}
function size(){const w=Math.min(innerWidth,innerHeight*LW/LH);S=w/LW;book.style.width=w+'px';book.style.height=(w*LH/LW)+'px';}
function show(i){book.textContent='';book.appendChild(big(getPage(i)));cur=i;}
function swish(){try{const A=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());const n=A.sampleRate*.28|0,b=A.createBuffer(1,n,A.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++){const t=i/n;d[i]=(Math.random()*2-1)*Math.sin(Math.PI*t)*(1-t)*.5;}
  const s=A.createBufferSource();s.buffer=b;const f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.6;const g=A.createGain();g.gain.value=.35;s.connect(f);f.connect(g);g.connect(A.destination);s.start();}catch(e){}}
function go(to){to=Math.max(0,Math.min(PAGES.length-1,to));if(busy||to===cur)return;busy=true;swish();
  const fwd=to>cur;book.textContent='';
  const under=big(getPage(fwd?to:cur)),top=big(getPage(fwd?cur:to));top.className='flip';
  const sh=document.createElement('div');sh.id='shade';
  book.appendChild(under);book.appendChild(top);book.appendChild(sh);
  top.style.transform=fwd?'rotateY(0deg)':'rotateY(-115deg)';
  void top.offsetWidth;
  requestAnimationFrame(()=>{top.style.transform=fwd?'rotateY(-115deg)':'rotateY(0deg)';sh.style.opacity=fwd?1:0;if(!fwd){sh.style.opacity=1;requestAnimationFrame(()=>sh.style.opacity=0);}});
  setTimeout(()=>{show(to);busy=false;},520);}
function tap(e){const r=book.getBoundingClientRect(),x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S;if(busy)return;
  for(const h of getPage(cur).hits)if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){go(h.pg);return;}
  go(cur+(x<LW*.33?-1:1));}
let sx=null;book.addEventListener('pointerdown',e=>{sx=e.clientX;});
book.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40){go(cur+(dx<0?1:-1));}else tap(e);});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);});
addEventListener('resize',()=>{if(!busy){size();}});
window.__pages=PAGES.length;window.__go=go;window.__show=show;
sprReady.then(()=>{size();for(let i=0;i<PAGES.length;i++)getPage(i);if(Object.keys(overflow).length)console.warn('PAGE OVERFLOW',overflow);window.__overflow=overflow;window.__ready=1;show(0);});
